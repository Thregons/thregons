<style>
:root{--bg:#120E24;--sf:#1D1738;--sf2:#251E46;--ln:#2C2550;--tx:#FFFFFF;--mu:#B9B3D6;--tq:#34E0C8;--vi:#6B3CF0;--vi2:#A98BFF;--vid:#5530D0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--tq)}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.scr{padding:calc(16px + env(safe-area-inset-top)) 18px 110px;display:flex;flex-direction:column;gap:18px}
.full{padding-bottom:40px}
h1,.h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:24px;line-height:1.15;margin:0}
h2,.h2{font-size:17px;font-weight:800;margin:0}
.muted{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sf);border-radius:16px;padding:4px}
.seg button{height:42px;border:0;border-radius:12px;background:transparent;color:var(--mu);font-weight:700;font-size:14px}
.seg button.on{background:#fff;color:#120E24}
.today{background:var(--vi);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}

.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.dots{display:flex;gap:6px}.dot{width:22px;height:22px;border-radius:11px;background:var(--ln);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--mu)}
.dot.on{background:var(--tq);color:#120E24}.dot.now{outline:2px solid var(--tq);outline-offset:-2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;min-height:124px;color:#fff}
.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--tq)}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#171230;border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:6px 0;min-height:52px}
nav.tabs button.on{color:var(--tq)}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.back{width:44px;height:44px;border-radius:22px;border:1px solid var(--ln);background:var(--sf);display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.lock{color:var(--vi2)}
.lesson{line-height:1.6;font-size:16px}
.lesson p{margin:0 0 12px}.lesson ul,.lesson ol{margin:0 0 12px;padding-left:22px}.lesson li{margin:4px 0}
.lesson table{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 14px;display:block;overflow-x:auto}
.lesson th,.lesson td{border:1px solid var(--ln);padding:7px 8px;text-align:left;vertical-align:top}
.lesson th{background:var(--sf2)}
.lesson strong,.lesson b{color:#fff}
.vid{aspect-ratio:16/10;border-radius:18px;background:var(--sf2);border:1px dashed var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mu);font-size:13px;text-align:center;padding:12px}
.timer{font-family:Unbounded,sans-serif;font-size:64px;font-weight:700;text-align:center;color:var(--tq)}
input.f,select.f{width:100%;height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);padding:0 14px;color:#fff}
label.l{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu);font-weight:600}
.done{color:var(--tq)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#fff;color:#120E24;padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:9;max-width:90%;text-align:center}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln)}
.ex:last-child{border-bottom:0}
.reps{color:var(--tq);font-weight:800;text-align:right;max-width:52%}
.step{position:relative}
.pill{display:inline-flex;padding:4px 8px;border-radius:8px;background:var(--sf2);font-size:12px;font-weight:700;color:var(--mu)}
</style>
</head>

а гири (гантели) в наклоне","m":"широчайшие, ромбовидная мышцы спины","c":1,"v":false},{"n":"махи гантелей через стороны","m":"средняя дельта","c":1,"v":false},{"n":"французский жим из-за головы с гирей","m":"трицепс","c":1,"v":false},{"n":"тяга в наклоне","m":"широчайшие, ромбовидная трапециевидная мышцы спины","c":1,"v":true},{"n":"выход на передний вис к поясу","m":"широчайшие, большие, малые круглые мышцы спины","c":1,"v":false}],"lessons":{"b0":{"t":"Как пользоваться бонусом","a":"База знаний THREGONS","h":"<p>Это база знаний для участников THREGONS: как работают энергия, сон, гормоны и добавки и что из этого реально даёт результат. Материал собран из гайдов G10 и перепроверен по клиническим рекомендациям и позициям научных обществ.<\/p>\n<p><strong>Порядок важности всегда один:<\/strong><\/p>\n<ol>\n<li>Сон 7–9 часов.<\/li>\n<li>Питание по своей норме калорий и белка.<\/li>\n<li>Тренировки и шаги.<\/li>\n<li>Анализы, если что-то не так.<\/li>\n<li>И только потом добавки — точечно, под задачу или дефицит.<\/li>\n<\/ol>\n<p>Без первых трёх пунктов добавки почти ничего не дают.<\/p>\n<p><strong>Граница с врачом.<\/strong> Бонус объясняет и направляет, но не ставит диагнозов и не назначает лечение. К врачу идём, если:<\/p>\n<ul>\n<li>усталость держится больше 1–2 месяцев, хотя сон и питание уже налажены;<\/li>\n<li>анализ вышел за референс лаборатории;<\/li>\n<li>вы принимаете лекарства (особенно антидепрессанты, антикоагулянты, гормоны) и хотите добавить БАД;<\/li>\n<li>есть хронические заболевания, беременность или грудное вскармливание;<\/li>\n<li>появились тревожные симптомы: боль в груди, обмороки, кровь в стуле, резкая потеря веса.<\/li>\n<\/ul>","k":"Знание"},"v1":{"t":"Ты выбираешь, кем быть","a":"Уолш · «Беседы с Богом»","h":"<p><b>Тезис.<\/b> Уолш говорит: каждое действие — это акт самоопределения. Делая что-то, ты не просто действуешь — ты решаешь, кто ты есть.<\/p>\n<p><b>В тренировках.<\/b> Тренировка — не наказание за вчерашний ужин и не борьба с ленью. Это выбор: «я — человек, который заботится о своём теле». Тело идёт за этим выбором, а не за силой воли.<\/p>\n<p><b>«Должен» → «выбираю».<\/b> Замени «я должен потренироваться» на «я выбираю потренироваться». Пропадает сопротивление, остаётся решение.<\/p>\n<p><b>Практика на сегодня.<\/b> Перед тренировкой скажи про себя одну фразу: «Сегодня я выбираю быть сильным». Потом просто начни разминку.<\/p>","k":"Взгляд"},"b2":{"t":"Философия THREGONS: тело, разум, топливо","a":"База знаний THREGONS","h":"<p>THREGONS — это три опоры: тело, разум и дух. Форма держится не на силе воли от срыва до срыва, а на привычках, которые становятся образом жизни.<\/p>\n<p><strong>Дисциплина как чистка зубов.<\/strong> Мы чистим зубы в любом настроении, в любую погоду, даже после ссоры и тяжёлого дня. Тренировка, нормальная еда и сон должны стать таким же базовым действием. Дисциплина в одном переносится на всё: спорт на самом деле тренирует не только мышцы, а умение договариваться с собой.<\/p>\n<p><strong>Еда — топливо.<\/strong> В бак на 50 литров никто не льёт 100. Мы едим, чтобы жить, а не живём, чтобы есть. Лёгкий голод на сушке — это нормально, его не нужно бояться и тушить орешками. Сигнал сытости приходит через 15–20 минут после начала еды, поэтому ешьте медленно и дайте ему время.<\/p>\n<p><strong>Два вида топлива.<\/strong> Физическое — то, что на тарелке. Духовное — то, чем мы наполняем голову: лента перед сном или два новых слова из иностранного, статья, навык. Оба даются одинаково трудно, и оба нужно выбирать осознанно.<\/p>\n<p><strong>Без радикализма.<\/strong> Полные запреты ведут к срывам. Исключаем продукт целиком только при аллергии или непереносимости, во всём остальном — мера. Отступления допустимы. Результат даёт регулярность — и хорошая, и плохая ведут к своему итогу.<\/p>\n<p><strong>Ошибки — часть пути.<\/strong> Всё, что имеет значение, — что вы снова вернулись. Кому-то понадобится месяц, кому-то год, и оба варианта нормальны. Если вы здесь — вы уже сделали главный шаг.<\/p>","k":"Знание"},"b3":{"t":"Цель и точка старта","a":"База знаний THREGONS","h":"<p>Цель выбирают по проценту жира и талии, а не по весу. Худой человек часто хочет сушиться, а человек с животом — набирать. Оба ошибаются.<\/p>\n<p><strong>Шаг 1. Талия к росту.<\/strong> Измерьте талию на уровне пупка и разделите на рост. Больше 0,5 — лишний жир на животе есть. Пример: рост 175, талия 92 → 0,53.<\/p>\n<p><strong>Шаг 2. Процент жира<\/strong> — на глаз по фото-примерам или на весах с анализатором. Домашние методы ошибаются на 3–5%, но для выбора цели этого хватает.<\/p>\n<p><strong>Шаг 3. Выбор цели:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Жир (муж. / жен.)<\/th>\n<th>Цель<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>больше 20% / 30%<\/td>\n<td>Сушка<\/td>\n<\/tr>\n<tr>\n<td>15–20% / 25–30%<\/td>\n<td>Рекомпозиция: норма или лёгкий дефицит + силовые<\/td>\n<\/tr>\n<tr>\n<td>10–15% / 20–25%<\/td>\n<td>Умеренная масса (+10%)<\/td>\n<\/tr>\n<tr>\n<td>меньше 10% / 20%<\/td>\n<td>Масса (+15–20%)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>«Тощий с животиком» (мало мышц, но талия больше 0,5) — это рекомпозиция, а не масса. На норме калорий с силовыми и высоким белком новичок одновременно теряет жир и набирает мышцы.<\/p>\n<p>Правило «рост минус 100 сравнить с весом» годится только как первая прикидка. При росте 175 и весе 81 оно даёт «массу», хотя при талии 95 см нужна сушка.<\/p>\n<p><strong>Стартовая анкета «до»:<\/strong> фото спереди, сбоку и сзади при одном свете, вес утром натощак, обхваты (талия, грудь, бёдра, рука). Повторять раз в неделю в одинаковых условиях.<\/p>\n<p><strong>Мотивация → дисциплина:<\/strong><\/p>\n<ul>\n<li>цель по SMART: «минус 6 см талии за 12 недель», а не «похудеть»;<\/li>\n<li>фиксированное время тренировок и отметки в календаре;<\/li>\n<li>правило «2 минут»: если лень, просто начать разминку;<\/li>\n<li>фото и замеры раз в неделю: прогресс на фото мотивирует лучше весов.<\/li>\n<\/ul>\n<p>Мотивация приходит после действия, а не до него.<\/p>","k":"Знание"},"b4":{"t":"Сон и восстановление","a":"База знаний THREGONS","h":"<p>Сон — главный рычаг всего бонуса. При сне меньше 6 часов падают тестостерон, сила и контроль аппетита, и никакая добавка это не вернёт.<\/p>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Как<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Длительность<\/td>\n<td>7–9 часов<\/td>\n<\/tr>\n<tr>\n<td>Режим<\/td>\n<td>Одно время отбоя и подъёма, в выходные сдвиг не больше часа<\/td>\n<\/tr>\n<tr>\n<td>Спальня<\/td>\n<td>18–20 °C, темнота, тишина или беруши<\/td>\n<\/tr>\n<tr>\n<td>Экраны<\/td>\n<td>Убрать за 30–60 мин до сна<\/td>\n<\/tr>\n<tr>\n<td>Кофеин<\/td>\n<td>Последний за 6–8 часов до сна<\/td>\n<\/tr>\n<tr>\n<td>Алкоголь<\/td>\n<td>Ускоряет засыпание, но режет глубокий сон<\/td>\n<\/tr>\n<tr>\n<td>Ужин<\/td>\n<td>За 2–3 часа до сна, без переедания<\/td>\n<\/tr>\n<tr>\n<td>Тяжёлая тренировка<\/td>\n<td>Не позже чем за 2–3 часа до сна<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Магний и мелатонин.<\/strong> Магний (глицинат или цитрат, 200–400 мг элементарного) на ночь можно попробовать без риска. Мелатонин — 1–3 мг за 30–60 минут до сна, короткими курсами: при смене часовых поясов или графика.<\/p>\n<p><strong>Сменная и ночная работа:<\/strong><\/p>\n<ul>\n<li>днём спать в полной темноте (плотные шторы или маска), по дороге домой после смены надевать тёмные очки;<\/li>\n<li>на работе держать яркий свет, чтобы оставаться бодрым;<\/li>\n<li>собрать 7–8 часов сна в сутки из основного сна и дневного на 30–90 мин перед сменой;<\/li>\n<li>не пить кофе за 4–6 часов до сна и не есть плотно прямо перед ним.<\/li>\n<\/ul>\n<p>Миф: «тестостерон вырабатывается строго с 22:00 до 02:00». На самом деле он растёт во время сна как такового. Важны длительность и регулярность, а не конкретные часы на циферблате.<\/p>","k":"Знание"},"v2":{"t":"Важность: без надрыва","a":"Зеланд · «Трансерфинг реальности»","h":"<p><b>Тезис.<\/b> У Зеланда избыточная важность — главный источник сопротивления. Чем сильнее «надо любой ценой», тем больше сил уходит на напряжение, и тем вероятнее откат.<\/p>\n<p><b>В тренировках.<\/b> Отсюда срывы: месяц «до отказа» — и полгода перерыва. Снизь важность: тренировка — обычное дело, как почистить зубы. Не идеально, а регулярно.<\/p>\n<p><b>Как понять, что важность завышена:<\/b> злишься на себя за пропуск, сравниваешь себя с другими, ждёшь результата к конкретной дате.<\/p>\n<p><b>Практика.<\/b> Сегодня сделай тренировку на 80% усилия. Без доказательств себе и другим. Просто отметь её — и живи дальше.<\/p>","k":"Взгляд"},"b6":{"t":"Жиросжигание без потери мышц","a":"База знаний THREGONS","h":"<p>Жир уходит только при дефиците энергии, а мышцы остаются, если дефицит умеренный, белка много и есть силовые. Норма по формуле — только старт. Дальше её подстраивают по еженедельным замерам.<\/p>\n<p><strong>Нормы на сушке:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Сколько<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Дефицит<\/td>\n<td>10–20% от нормы поддержания<\/td>\n<\/tr>\n<tr>\n<td>Темп<\/td>\n<td>0,5–1% веса в неделю<\/td>\n<\/tr>\n<tr>\n<td>Белок<\/td>\n<td>1,8–2,2 г/кг целевого веса<\/td>\n<\/tr>\n<tr>\n<td>Жиры<\/td>\n<td>0,8–1 г/кг, не ниже 20% калорий<\/td>\n<\/tr>\n<tr>\n<td>Углеводы<\/td>\n<td>Всё остальное, база — крупы, картофель, фрукты<\/td>\n<\/tr>\n<tr>\n<td>Клетчатка<\/td>\n<td>25–35 г, добавлять постепенно<\/td>\n<\/tr>\n<tr>\n<td>Вода<\/td>\n<td>Около 35 мл/кг + то, что выпили на тренировке<\/td>\n<\/tr>\n<tr>\n<td>Силовые<\/td>\n<td>3–4 раза в неделю, рабочие веса не снижать<\/td>\n<\/tr>\n<tr>\n<td>Шаги<\/td>\n<td>8–12 тыс. в день<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Если лишнего жира много<\/strong>, белок считают на целевой вес, а не на текущий. Ориентир для мужчин: рост − 100. Пример: рост 175, вес 110 → белок на 75–85 кг.<\/p>\n<p><strong>Как подстраивать норму по замерам<\/strong> (талия и вес раз в неделю, утром натощак, на одних весах):<\/p>\n<table>\n<thead>\n<tr>\n<th>За 2 недели<\/th>\n<th>Действие<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Вес и талия стоят<\/td>\n<td>−150–200 ккал за счёт углеводов или +2 тыс. шагов<\/td>\n<\/tr>\n<tr>\n<td>Темп 0,5–1% в неделю, энергия есть<\/td>\n<td>Ничего не менять<\/td>\n<\/tr>\n<tr>\n<td>Быстрее 1% или падают силы<\/td>\n<td>+150–200 ккал<\/td>\n<\/tr>\n<tr>\n<td>После 8–12 недель дефицита<\/td>\n<td>1–2 недели на норме поддержания<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>На массе логика та же: цель +0,25–0,5% веса в неделю, талия растёт медленнее рук и груди. Реальный набор мышц у новичка — около 0,5–1 кг в месяц в первый год. Всё, что сверх этого, — вода и жир.<\/p>\n<p><strong>Что не сжигает жир:<\/strong> сауна и термокостюм (уходит вода), детокс-чаи, плёнка, «жиросжигающие продукты», вода с лимоном натощак. Фрукты можно есть и после 15:00 — важна сумма за день.<\/p>\n<p><strong>Рабочие приёмы на сушке:<\/strong><\/p>\n<ul>\n<li><strong>«10 минут»<\/strong> — пришли голодными: стакан воды и овощи, а еда через 10 минут.<\/li>\n<li><strong>Дробление<\/strong> — если привыкли к большим порциям, делите ужин на два приёма.<\/li>\n<li><strong>«Правило дня рождения»<\/strong> — в гостях сначала белок и овощи, потом сладкое в одну тарелку, без добавки.<\/li>\n<li><strong>Не ходить в магазин голодным<\/strong> и покупать по списку.<\/li>\n<li><strong>Свободный приём пищи<\/strong> раз в 7–10 дней, а не целый свободный день.<\/li>\n<li><strong>В ресторане<\/strong> — мясо или рыба с гарниром, соус отдельно. Салаты с заправкой часто калорийнее горячего.<\/li>\n<li><strong>Есть спокойно<\/strong> и тщательно жевать: тяжесть и вздутие часто уходят уже от этого.<\/li>\n<\/ul>\n<p><strong>Сахар и кофе.<\/strong> Сахар не яд: в пределах нормы калорий до 10% сахара не мешает сушке. Кофе — до 400 мг кофеина в день и не позже чем за 6–8 часов до сна.<\/p>\n<p><strong>Приёмы на массе<\/strong> (для тех, кому трудно съесть норму):<\/p>\n<ul>\n<li><strong>Плотные по калориям продукты<\/strong> — больше калорий в меньшем объёме: ореховая паста, изюм вместо винограда, хлеб вместо хлебцов, масло в кашу. Хлебцы по калориям на 100 г не сильно уступают хлебу, но занимают в желудке в разы больше места.<\/li>\n<li><strong>Дробление<\/strong> — есть каждые 2–3 часа, если норму не уложить в 3 приёма.<\/li>\n<li><strong>Пить часть калорий<\/strong> — коктейли и гейнер переносятся легче твёрдой еды, см. раздел «Добавки».<\/li>\n<li><strong>Пюре и смузи<\/strong> — для совсем худых: тот же рацион в измельчённом виде съедается проще.<\/li>\n<li>Овощи на массе нужны, но без горы салата перед едой: он забивает место.<\/li>\n<\/ul>\n<p><strong>Праздники без срыва:<\/strong><\/p>\n<ol>\n<li>За 1–2 часа до выхода съесть полпорции своего обычного приёма — прийти не голодным.<\/li>\n<li>Никому не рассказывать про диету и никого не учить.<\/li>\n<li>Выбрать одно горячее и один кусочек торта — то, что действительно хочется попробовать. Всё это можно съесть и в другой день.<\/li>\n<li>Назавтра не «отрабатывать» и не голодать, а просто вернуться к плану.<\/li>\n<\/ol>\n<p>Раз в месяц праздник не влияет ни на что. Праздник каждые три дня — уже режим, и результат будет соответствующим.<\/p>","k":"Знание"},"v3":{"t":"Кормить себя с заботой","a":"Зеланд · «Управление реальностью»","h":"<p><b>Тезис.<\/b> Зеланд советует относиться к еде как к заботе о себе: есть с вниманием, а не на бегу и не перед лентой. Отношение к себе превращается в привычку, а привычка — в реальность.<\/p>\n<p><b>В питании.<\/b> Это ложится на принцип THREGONS «еда — топливо». Мы едим, чтобы жить. Спокойный приём пищи без телефона — уже половина контроля порций: сытость приходит через 15–20 минут.<\/p>\n<p><b>Практика.<\/b> Один приём пищи сегодня — без экрана. Медленно, с мыслью: «я заправляю своё тело тем, что ему нужно».<\/p>\n<p class=\"muted\">Нормы калорий и БЖУ — в разделе «Питание». Отношение задаёт Зеланд, цифры — наука.<\/p>","k":"Взгляд"},"b8":{"t":"Энергия и хроническая усталость","a":"База знаний THREGONS","h":"<p>Постоянная усталость в 30 лет — не норма. Обычно за ней стоит простая и исправимая причина. Важно различать: «хроническая усталость» как состояние и синдром хронической усталости (МЭ/СХУ) как диагноз. Диагноз ставит только врач.<\/p>\n<p><strong>Частые причины и что проверить:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Причина<\/th>\n<th>Проверить<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Недосып<\/td>\n<td>Спите ли вы 7–9 часов<\/td>\n<\/tr>\n<tr>\n<td>Нехватка железа<\/td>\n<td>ОАК, ферритин<\/td>\n<\/tr>\n<tr>\n<td>Низкий витамин D<\/td>\n<td>25(OH)D — если мало солнца или есть симптомы<\/td>\n<\/tr>\n<tr>\n<td>Щитовидная железа<\/td>\n<td>ТТГ, св. Т4<\/td>\n<\/tr>\n<tr>\n<td>Дефицит B12<\/td>\n<td>B12, особенно у вегетарианцев<\/td>\n<\/tr>\n<tr>\n<td>Сахар и инсулин<\/td>\n<td>Глюкоза натощак, HbA1c<\/td>\n<\/tr>\n<tr>\n<td>Стресс, выгорание<\/td>\n<td>Режим работы и отдыха<\/td>\n<\/tr>\n<tr>\n<td>Слишком жёсткий дефицит калорий<\/td>\n<td>Норма из инструкции по питанию<\/td>\n<\/tr>\n<tr>\n<td>Перетренированность<\/td>\n<td>Пульс в покое, падают рабочие веса<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Самопроверка энергии.<\/strong> Отметьте, что держится больше двух недель:<\/p>\n<ul>\n<li>[ ] просыпаюсь без сил, утром тяжело вставать<\/li>\n<li>[ ] к обеду клонит в сон<\/li>\n<li>[ ] быстро устаю, стоит сесть за работу<\/li>\n<li>[ ] снизилось либидо<\/li>\n<li>[ ] нет желания делать даже любимое<\/li>\n<li>[ ] силовые стоят или падают<\/li>\n<li>[ ] после нагрузки восстанавливаюсь дольше суток<\/li>\n<li>[ ] сон не освежает<\/li>\n<\/ul>\n<p><strong>Как читать:<\/strong> 0–2 отметки — подтянуть сон и питание; 3–5 — плюс базовые анализы из раздела «Чекап»; 6+ или слабость после нагрузки дольше суток — к врачу. Это ориентир для действий, а не диагноз.<\/p>\n<p><strong>МЭ/СХУ как диагноз<\/strong> (критерии IOM 2015): усталость больше 6 месяцев, не проходит после отдыха и сильно снижает активность. К ней добавляется ухудшение после нагрузки, неосвежающий сон и проблемы с мышлением или давлением. При такой картине наращивать нагрузку через силу нельзя: сначала врач.<\/p>\n<p><strong>Что делать с обычной усталостью:<\/strong> сон 7–9 часов, белок в каждом приёме пищи и минимум сахара, 8–10 тыс. шагов, меньше ленты и новостей, дыхательные практики. И через 1–2 месяца без улучшения — анализы.<\/p>","k":"Знание"},"b9":{"t":"Как усваиваются питание и витамины","a":"База знаний THREGONS","h":"<p>Усвоение зависит не от того, что проглотили, а от того, как работает ЖКТ. Поэтому пищеварение — фундамент всего остального.<\/p>\n<ol>\n<li><strong>Рот<\/strong> — жевание и слюна начинают расщеплять углеводы.<\/li>\n<li><strong>Желудок<\/strong> — кислота обеззараживает еду, фермент пепсин начинает переваривать белок. Желудок и перемешивает, и переваривает.<\/li>\n<li><strong>Тонкий кишечник<\/strong> — главное место переваривания и всасывания. Ферменты поджелудочной и желчь из печени разбирают белки, жиры и углеводы. Витамины и минералы всасываются в основном здесь.<\/li>\n<li><strong>Толстый кишечник<\/strong> — вода, микробиота, клетчатка. В кишечнике сосредоточена большая часть иммунных клеток организма.<\/li>\n<\/ol>\n<p>При вздутии, синдроме раздражённого кишечника или целиакии всасывание худшает, и дефициты появляются даже при хорошем рационе. Жёсткие диеты дают тот же итог с другой стороны: витаминов просто не доходит. Организм переходит в «режим экономии» — усталость, холод, апатия, срывы. Поэтому сначала еда и ЖКТ, а потом таблетки.<\/p>\n<p><strong>Мультивитамины.<\/strong> Обычный мультивитамин в профилактических дозах безопасен и полезен при однообразном питании или диете. Проблема не в нём, а в мегадозах и в том, что поверх него пьют ещё цинк, D и железо отдельно.<\/p>","k":"Знание"},"b10":{"t":"ЖКТ: Бристольская шкала","a":"База знаний THREGONS","h":"<p>Стул — простой индикатор того, как работает пищеварение. Норма — типы 3–4.<\/p>\n<table>\n<thead>\n<tr>\n<th>Тип<\/th>\n<th>Как выглядит<\/th>\n<th>Значит<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Отдельные твёрдые комки<\/td>\n<td>Запор<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Комковатая «колбаска»<\/td>\n<td>Склонность к запору<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>«Колбаска» с трещинами<\/td>\n<td>Норма<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Мягкая и гладкая<\/td>\n<td>Идеал<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Мягкие комочки с чёткими краями<\/td>\n<td>Мало клетчатки<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Рыхлый, с рваными краями<\/td>\n<td>Ускоренный транзит<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Жидкий<\/td>\n<td>Диарея<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Что делать при типах 1–2:<\/strong> больше воды, овощей, фруктов и цельных круп, шаги. Клетчатку повышать постепенно: первую неделю овощи только на завтрак, потом в два приёма, иначе будет вздутие. Можно магний цитрат.<\/p>\n<p><strong>К врачу сразу<\/strong>, если в стуле кровь, он чёрный, диарея держится больше 3 дней, есть ночные позывы или вес уходит без причины.<\/p>","k":"Знание"},"v4":{"t":"Пропуск — поворот, а не провал","a":"Зеланд · принцип координации намерения","h":"<p><b>Тезис.<\/b> Принцип координации намерения у Зеланда: если вознамериться рассматривать событие, кажущееся негативным, как позитивное, — так и будет. Череда неудач идёт не за самой неудачей, а за отношением к ней.<\/p>\n<p><b>В тренировках.<\/b> Пропустил день, сорвался на сладкое, заболел. Старый сценарий: «всё пропало, начну с понедельника». Новый: «отлично, тело получило отдых — сегодня возвращаюсь».<\/p>\n<p><b>Главное правило THREGONS:<\/b> значение имеет только то, что ты снова вернулся.<\/p>\n<p><b>Практика.<\/b> Заведи «идиотскую» привычку, как пишет Зеланд, — радоваться мелким неудачам. После пропуска первая фраза: «Это к лучшему. Продолжаю».<\/p>","k":"Взгляд"},"b12":{"t":"Чекап: базовые анализы","a":"База знаний THREGONS","h":"<p>Анализы нужны не для того, чтобы «разрешить себе добавки». Они показывают, нужны ли добавки вообще, в какой дозе и на какой срок. Для здорового тренирующегося человека разумный ритм — раз в год и при жалобах.<\/p>\n<p><strong>Базовый набор:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Анализ<\/th>\n<th>Что показывает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ОАК<\/td>\n<td>Анемия, воспаление<\/td>\n<\/tr>\n<tr>\n<td>Ферритин<\/td>\n<td>Запасы железа<\/td>\n<\/tr>\n<tr>\n<td>Глюкоза натощак, HbA1c<\/td>\n<td>Углеводный обмен<\/td>\n<\/tr>\n<tr>\n<td>Липидограмма<\/td>\n<td>Холестерин, риск для сосудов<\/td>\n<\/tr>\n<tr>\n<td>АЛТ, АСТ, креатинин<\/td>\n<td>Печень и почки<\/td>\n<\/tr>\n<tr>\n<td>ТТГ<\/td>\n<td>Щитовидная железа<\/td>\n<\/tr>\n<tr>\n<td>С-реактивный белок<\/td>\n<td>Скрытое воспаление<\/td>\n<\/tr>\n<tr>\n<td>25(OH)D, B12<\/td>\n<td>По показаниям (см. ниже)<\/td>\n<\/tr>\n<tr>\n<td>Тестостерон, ГСПГ<\/td>\n<td>Мужчинам при симптомах<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Сдавать утром натощак, через 1–2 дня после тяжёлой тренировки. За 2–3 дня до сдачи не пить биотин: он искажает ТТГ и гормоны.<\/p>\n<p><strong>Витамин D, 25(OH)D:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Уровень<\/th>\n<th>Что это значит<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>меньше 20 нг/мл<\/td>\n<td>Дефицит — дозу и срок назначает врач<\/td>\n<\/tr>\n<tr>\n<td>20–29<\/td>\n<td>Недостаточность<\/td>\n<\/tr>\n<tr>\n<td>30–50<\/td>\n<td>Достаточно<\/td>\n<\/tr>\n<tr>\n<td>больше 60<\/td>\n<td>Добавки не нужны<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Здоровым взрослым до 75 лет Эндокринологическое общество (2024) не советует ни рутинно сдавать анализ на витамин D, ни пить его сверх нормы. Сдавать стоит, если солнца мало, есть симптомы или так сказал врач. Ударные дозы вроде 10 000 МЕ в день — только по назначению и с контролем, иначе есть риск избытка кальция.<\/p>\n<p><strong>Ферритин:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Уровень<\/th>\n<th>Что делать<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>меньше 30 нг/мл<\/td>\n<td>Запасы исчерпаны — к врачу, искать причину<\/td>\n<\/tr>\n<tr>\n<td>30–50<\/td>\n<td>Погранично для спортсменов — больше красного мяса и печени<\/td>\n<\/tr>\n<tr>\n<td>50–200<\/td>\n<td>Норма, железо не нужно<\/td>\n<\/tr>\n<tr>\n<td>больше 300 (мужчины)<\/td>\n<td>Повышен — к врачу<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Железо без дефицита не принимают: его избыток усиливает окислительный стресс. Ферритин растёт и при воспалении, поэтому его смотрят вместе с СРБ.<\/p>","k":"Знание"},"v5":{"t":"Визуализация процесса","a":"Зеланд · «Шелест утренних звёзд»","h":"<p><b>Тезис.<\/b> Зеланд прямо пишет про тело: растите его, как мать ребёнка. Двигает к цели не созерцание результата, а визуализация процесса — как тело постепенно приобретает форму.<\/p>\n<p><b>В тренировках.<\/b> Не смотри на чужие фото «после». Представляй, как мышцы прямо сейчас растут и подтягиваются, как с каждой неделей легче идёт подход.<\/p>\n<p><b>Формула Зеланда:<\/b> у меня всё получается, сегодня я делаю лучше, чем вчера, а завтра будет лучше, чем сегодня.<\/p>\n<p><b>Практика.<\/b> Во время отдыха между подходами — 20 секунд: представь мышцу, которую сейчас работал, и как она становится сильнее.<\/p>","k":"Взгляд"},"b14":{"t":"Витамины и минералы","a":"База знаний THREGONS","h":"<p>Большую часть витаминов даёт нормальный рацион: мясо и рыба, яйца, молочное, крупы, овощи и фрукты. Добавки нужны, чтобы закрыть то, чего не хватает, — а не «на всякий случай».<\/p>\n<p><strong>Как принимать:<\/strong><\/p>\n<ul>\n<li><strong>Жирорастворимые A, D, E, K<\/strong> — во время еды с жирами. Они накапливаются, поэтому их можно перебрать.<\/li>\n<li><strong>Водорастворимые (группа B, C)<\/strong> — в любое время. Излишки выводятся, кроме B12.<\/li>\n<li><strong>Цинк, железо и кальций<\/strong> мешают друг другу усваиваться — разносить их на 2+ часа.<\/li>\n<li><strong>D3 + K2.<\/strong> K2 часто добавляют к D3, чтобы кальций шёл в кости. Логика разумная, но данных по исходам пока мало. При обычных дозах D3 K2 не обязателен. Осторожно: K2 взаимодействует с варфарином.<\/li>\n<li><strong>Группа B<\/strong> имеет смысл, если мало животных продуктов или анализ показал дефицит. Веганам B12 нужен всегда.<\/li>\n<li><strong>Омега-3.<\/strong> Жирная рыба 2–3 раза в неделю заменяет добавку. Иначе 1–2 г EPA+DHA в сутки во время еды. Считать нужно именно EPA+DHA, а не «1000 мг рыбьего жира» на банке.<\/li>\n<\/ul>\n<p><strong>Формы магния:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Форма<\/th>\n<th>Для чего<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Глицинат<\/td>\n<td>Сон, стресс, мягкий для ЖКТ<\/td>\n<\/tr>\n<tr>\n<td>Цитрат<\/td>\n<td>Хорошо усваивается, слабит<\/td>\n<\/tr>\n<tr>\n<td>Малат<\/td>\n<td>Днём, при вялости<\/td>\n<\/tr>\n<tr>\n<td>Таурат<\/td>\n<td>Сердце, давление<\/td>\n<\/tr>\n<tr>\n<td>L-треонат<\/td>\n<td>Мозг (данных пока мало)<\/td>\n<\/tr>\n<tr>\n<td>Оксид<\/td>\n<td>Плохо усваивается, слабит — не для дефицита<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Верхние безопасные пределы для взрослых<\/strong> (еда + добавки, если нет назначения врача):<\/p>\n<table>\n<thead>\n<tr>\n<th>Вещество<\/th>\n<th>Предел в сутки<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Витамин D<\/td>\n<td>4000 МЕ<\/td>\n<\/tr>\n<tr>\n<td>Цинк<\/td>\n<td>40 мг<\/td>\n<\/tr>\n<tr>\n<td>Магний из добавок<\/td>\n<td>350 мг<\/td>\n<\/tr>\n<tr>\n<td>Железо<\/td>\n<td>45 мг<\/td>\n<\/tr>\n<tr>\n<td>Витамин A (ретинол)<\/td>\n<td>3000 мкг<\/td>\n<\/tr>\n<tr>\n<td>Витамин B6<\/td>\n<td>12 мг (ЕС)<\/td>\n<\/tr>\n<tr>\n<td>Селен<\/td>\n<td>255 мкг (ЕС) / 400 мкг (США)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Цинк дольше нескольких недель выше 40 мг вытесняет медь. Это грозит анемией, падением иммунитета и поражением нервов. Проверьте, сколько цинка уже есть в вашем мультивитамине.<\/p>\n<p><strong>Проверенные производители:<\/strong> Thorne, Pure Encapsulations, Life Extension, NOW Foods, Jarrow, Doctor’s Best, Solgar. Лучше выбирать продукты со сторонней сертификацией (NSF, USP, Informed Sport).<\/p>","k":"Знание"},"b15":{"t":"Флавоноиды и омега-3","a":"База знаний THREGONS","h":"<p>Флавоноиды — растительные антиоксиданты из фруктов, ягод, овощей и чая. В большом датском исследовании (56 тыс. человек, 23 года наблюдения) люди, получавшие около 500 мг флавоноидов в день, реже умирали от болезней сердца и рака. Это связь, а не доказанная причина, но как ориентир для тарелки она работает.<\/p>\n<p><strong>Как собрать 500 мг за день:<\/strong> чашка чая + яблоко + апельсин + 100 г черники + 100 г брокколи.<\/p>\n<p><strong>Где больше всего флавоноидов:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Продукт<\/th>\n<th>Что в нём<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Цитрусовые<\/td>\n<td>Гесперидин, нарингенин<\/td>\n<\/tr>\n<tr>\n<td>Ягоды: черника, малина, клюква, ежевика, чёрная смородина<\/td>\n<td>Антоцианы — дают яркий цвет<\/td>\n<\/tr>\n<tr>\n<td>Зелёные и крестоцветные: шпинат, кейл, брокколи<\/td>\n<td>Кемпферол, кверцетин<\/td>\n<\/tr>\n<tr>\n<td>Чай: зелёный, чёрный, белый<\/td>\n<td>Катехины<\/td>\n<\/tr>\n<tr>\n<td>Тёмный шоколад 70%+<\/td>\n<td>Флаванолы — для сосудов<\/td>\n<\/tr>\n<tr>\n<td>Виноград, особенно с кожурой<\/td>\n<td>Антоцианы, катехины<\/td>\n<\/tr>\n<tr>\n<td>Лук, особенно красный<\/td>\n<td>Кверцетин<\/td>\n<\/tr>\n<tr>\n<td>Яблоки с кожурой<\/td>\n<td>Кверцетин, катехины<\/td>\n<\/tr>\n<tr>\n<td>Гречка<\/td>\n<td>Рутин — для сосудов<\/td>\n<\/tr>\n<tr>\n<td>Оливковое масло extra virgin<\/td>\n<td>Полифенолы, флавоноидов немного<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Правило THREGONS — «цветная тарелка»: в каждом приёме пищи что-то яркое из списка выше. Красное вино к источникам не относим: вред алкоголя перевешивает, виноград даёт то же самое. Добавки с флавоноидами не нужны, если есть еда. Концентраты могут взаимодействовать с лекарствами.<\/p>\n<p><strong>Омега-3 и антиоксиданты.<\/strong> Омега-3 — нестабильный жир, он может окисляться (прогорать). Но проблема в качестве и хранении продукта, а не в том, что омегу «нельзя пить одну». В капсулы уже добавляют витамин E, а эффект омеги на триглицериды показан именно в исследованиях рыбьего жира без добавок. Что делаем:<\/p>\n<ul>\n<li>покупаем свежий продукт с сертификацией, храним в прохладном тёмном месте;<\/li>\n<li>капсула с резким рыбным запахом или горечью — в мусор;<\/li>\n<li>пьём во время еды, а в рационе есть ягоды, цитрусы, орехи и зелень — это лучшая «антиоксидантная связка»;<\/li>\n<li>лучше всего — жирная рыба 2–3 раза в неделю, добавка 1–2 г EPA+DHA — если рыбы нет.<\/li>\n<\/ul>\n<p>Отдельный витамин C 500 мг к омеге не обязателен: апельсин или горсть ягод дают норму из еды.<\/p>","k":"Знание"},"v6":{"t":"Шаг за шагом","a":"Зеланд · трансферные цепочки","h":"<p><b>Тезис.<\/b> По Зеланду, к далёкой цели идут не прыжком, а звеньями: реальность инертна, переход идёт непрерывно и поэтапно. Кто забегает вперёд, получает разочарование.<\/p>\n<p><b>Поэтому знания здесь открываются по шагам.<\/b> Сначала сон и ритм, потом питание, потом анализы и только потом добавки. Каждое звено держится на предыдущем.<\/p>\n<p><b>В тренировках.<\/b> Уровни «Старт → Дом → Улица → Зал» — та же цепочка. Переходи на следующий, когда текущий даётся спокойно, без одышки и надрыва.<\/p>\n<p><b>Практика.<\/b> Назови своё текущее звено одной фразой. Например: «4 тренировки в неделю без пропусков». Думай только о нём.<\/p>","k":"Взгляд"},"b17":{"t":"Добавки: что работает","a":"База знаний THREGONS","h":"<p>Добавок, которые сами сжигают жир, не существует. Доказанно работает короткий список спортивных добавок, а витамины и минералы помогают только при дефиците.<\/p>\n<p><strong>Уровень A — сильная доказательная база:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Добавка<\/th>\n<th>Как принимать<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Креатин моногидрат<\/td>\n<td>3–5 г каждый день в любое время. Циклы и перерывы не нужны<\/td>\n<\/tr>\n<tr>\n<td>Кофеин<\/td>\n<td>3–6 мг/кг за 30–60 мин до тренировки, до 400 мг в день<\/td>\n<\/tr>\n<tr>\n<td>Протеин<\/td>\n<td>Чтобы добрать норму белка, если не выходит едой<\/td>\n<\/tr>\n<tr>\n<td>Бета-аланин<\/td>\n<td>4–6 г в день дробно, минимум 4 недели. Для усилий 1–4 мин. Покалывание кожи безопасно<\/td>\n<\/tr>\n<tr>\n<td>Нитраты (свёкла)<\/td>\n<td>400–800 мг нитрата за 2–3 часа до нагрузки. Для выносливости<\/td>\n<\/tr>\n<tr>\n<td>Электролиты<\/td>\n<td>На тренировках дольше часа или в жару<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Уровень B — по задаче или при дефиците:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Добавка<\/th>\n<th>Когда<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Витамин D, железо, B12<\/td>\n<td>Только при подтверждённом дефиците<\/td>\n<\/tr>\n<tr>\n<td>Омега-3<\/td>\n<td>Если рыбы меньше 2 раз в неделю<\/td>\n<\/tr>\n<tr>\n<td>Магний<\/td>\n<td>Плохой сон, судороги, мало орехов и зелени<\/td>\n<\/tr>\n<tr>\n<td>Цитруллин малат<\/td>\n<td>6–8 г за час до тренировки, эффект небольшой<\/td>\n<\/tr>\n<tr>\n<td>HMB<\/td>\n<td>Для новичков в первые месяцы<\/td>\n<\/tr>\n<tr>\n<td>L-теанин<\/td>\n<td>100–200 мг вместе с кофеином — меньше нервозности<\/td>\n<\/tr>\n<tr>\n<td>Мелатонин<\/td>\n<td>Смена часовых поясов и графика, коротко<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Уровень C — слабая доказательная база, деньги лучше потратить на еду:<\/strong> BCAA и EAA (при достатке белка), L-карнитин для похудения, CLA, зелёный кофе, кетоновые добавки, трибулус и «бустеры», рибоксин, Peak ATP, PQQ, NMN, шиладжит, детокс-чаи, коллоидное серебро, гомеопатия.<\/p>\n<p><strong>С осторожностью или не принимать без врача:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Риск<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Йохимбин<\/td>\n<td>Тахикардия, давление, тревога. Жир «точечно с живота» не сжигает<\/td>\n<\/tr>\n<tr>\n<td>Экстракт зелёного чая в капсулах<\/td>\n<td>Печень, особенно натощак и в больших дозах<\/td>\n<\/tr>\n<tr>\n<td>5-HTP<\/td>\n<td>Серотониновый синдром вместе с антидепрессантами и трамадолом<\/td>\n<\/tr>\n<tr>\n<td>Ашваганда<\/td>\n<td>Описаны случаи поражения печени<\/td>\n<\/tr>\n<tr>\n<td>DHEA, прогормоны<\/td>\n<td>Ломают гормональный фон<\/td>\n<\/tr>\n<tr>\n<td>Стимуляторные жирожигатели<\/td>\n<td>Сердце, сон, тревога<\/td>\n<\/tr>\n<tr>\n<td>Мельдоний (милдронат)<\/td>\n<td>Запрещён WADA с 2016 года, пользы для здоровых не доказано<\/td>\n<\/tr>\n<tr>\n<td>Высокие дозы цинка, железа, D<\/td>\n<td>См. верхние пределы в разделе о витаминах<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Простая схема на день тренировки:<\/strong> креатин в любое время дня, кофе за 30–60 минут, на длинной или жаркой тренировке — вода с электролитами. Бета-аланин и свёкла имеют смысл под интервальную работу и выносливость.<\/p>\n<p><strong>Домашний гейнер<\/strong> (только для тех, кому трудно набрать): 1 порция протеина, банан, 40 г овсянки, 20 г орехов или семечек, ложка мёда, ягоды, молоко — в блендер. Примерно 600 ккал.<\/p>","k":"Знание"},"v7":{"t":"Маятники и своя цель","a":"Зеланд · «Пространство вариантов»","h":"<p><b>Тезис.<\/b> Маятники у Зеланда — структуры, которые питаются вниманием людей: лента, чужие стандарты, гонка за трендами. Они навязывают чужие цели. А своя цель — та, к которой лежит душа.<\/p>\n<p><b>В тренировках.<\/b> Не срисовывай образ с других. Твоя цель — не чужое тело из рилса, а твоё: сильное, здоровое, выносливое. Сравнивай себя только с собой месяц назад.<\/p>\n<p><b>Признак чужой цели:<\/b> думаешь о ней с напряжением и «надо». Своя — вдохновляет и даёт силы.<\/p>\n<p><b>Практика.<\/b> Сделай фото и замеры. Через 4 недели сравни с собой — не с кем-то ещё.<\/p>","k":"Взгляд"},"b19":{"t":"Тестостерон у мужчин","a":"База знаний THREGONS","h":"<p>Тестостерон поднимает режим, а не банка «бустера». После 30 лет он снижается примерно на 1% в год. Гораздо сильнее его роняют лишний жир, недосып, алкоголь и хронический стресс.<\/p>\n<p><strong>Что измерять:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Показатель<\/th>\n<th>Зачем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Общий тестостерон<\/td>\n<td>База. Сдавать утром до 10:00, натощак<\/td>\n<\/tr>\n<tr>\n<td>ГСПГ<\/td>\n<td>Связывает тестостерон и выключает его<\/td>\n<\/tr>\n<tr>\n<td>Альбумин<\/td>\n<td>Нужен для расчёта свободного<\/td>\n<\/tr>\n<tr>\n<td>Свободный тестостерон<\/td>\n<td>Считается по общему, ГСПГ и альбумину<\/td>\n<\/tr>\n<tr>\n<td>ЛГ, эстрадиол, пролактин<\/td>\n<td>Если тестостерон низкий — по назначению врача<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Нормы.<\/strong> Гармонизированный диапазон общего тестостерона для мужчин 19–39 лет — 9,2–31,8 нмоль/л. В разных лабораториях цифры отличаются, поэтому ориентир — референс вашей лаборатории. Дефицит ставят только при сочетании симптомов и двух утренних анализов ниже нормы. Правило «ГСПГ должен равняться возрасту» — народное, смотрим на референс.<\/p>\n<p><strong>Симптомы, при которых стоит сдать анализ:<\/strong> снижение либидо и утренних эрекций, постоянная усталость, падение силы и мышечной массы, рост жира на животе, подавленное настроение. Каждый симптом по отдельности неспецифичен: то же самое дают недосып, анемия и депрессия.<\/p>\n<p><strong>Что реально поднимает тестостерон:<\/strong><\/p>\n<ol>\n<li><strong>Снижение лишнего жира<\/strong> — самый сильный фактор у мужчин с избытком веса.<\/li>\n<li><strong>Сон 7–9 часов.<\/strong> Неделя по 5 часов заметно снижает тестостерон даже у молодых.<\/li>\n<li><strong>Силовые 3–4 раза в неделю<\/strong> на базовых упражнениях и без перетренированности.<\/li>\n<li><strong>Жиры не ниже 20–25% калорий<\/strong> — на очень низкожирном рационе тестостерон немного ниже.<\/li>\n<li><strong>Минимум алкоголя.<\/strong> Вредит сам алкоголь, а не «фитоэстрогены пива».<\/li>\n<li><strong>Закрыть дефициты<\/strong> витамина D и цинка, если они есть. Без дефицита добавки тестостерон не поднимают.<\/li>\n<\/ol>\n<p><strong>Добавки «для тестостерона»:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Добавка<\/th>\n<th>Что показывают исследования<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Витамин D, цинк<\/td>\n<td>Помогают только при дефиците<\/td>\n<\/tr>\n<tr>\n<td>Бор<\/td>\n<td>Маленькие исследования, эффект небольшой. До 10 мг в сутки<\/td>\n<\/tr>\n<tr>\n<td>Пажитник (фенугрек)<\/td>\n<td>Умеренные данные, эффект небольшой<\/td>\n<\/tr>\n<tr>\n<td>Ашваганда<\/td>\n<td>Небольшой эффект на стресс, есть случаи поражения печени<\/td>\n<\/tr>\n<tr>\n<td>Мака<\/td>\n<td>Повышает либидо, но не тестостерон<\/td>\n<\/tr>\n<tr>\n<td>D-аспарагиновая кислота<\/td>\n<td>Результаты противоречивы, не рекомендуем<\/td>\n<\/tr>\n<tr>\n<td>«Бустеры»-смеси<\/td>\n<td>Анализы обычно не меняют<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Мифы:<\/strong> соя не снижает тестостерон — это проверено на 41 исследовании. Короткий отдых между подходами даёт краткий всплеск гормонов, но на рост мышц это не влияет. Слюна — не лучший способ мерить свободный тестостерон: стандартом считается расчёт по крови.<\/p>\n<p><strong>ТЗТ и стероиды.<\/strong> Заместительная терапия — только по диагнозу и под контролем андролога или эндокринолога. Она подавляет выработку спермы, это важно, если планируются дети. Стероиды для формы THREGONS не рекомендует.<\/p>","k":"Знание"},"b20":{"t":"Стероиды: честный разговор","a":"База знаний THREGONS","h":"<p>Для атлетичного и функционального тела препараты не нужны. Нужны система тренировок, питание, сон и восстановление.<\/p>\n<ul>\n<li><strong>Ошибка выжившего.<\/strong> В соцсетях видно только тех, кому курс «зашёл». До курса они уже выглядели сильно. Тех, кто получил только побочки, никто не показывает.<\/li>\n<li><strong>Если без курса не получается, с курсом тоже не получится.<\/strong> Проблема обычно не в гормонах, а в системе: нет программы, прогрессии нагрузки, питания и сна. Многие годами ходят в зал и ни разу не нагружаются по-настоящему.<\/li>\n<li><strong>Реальная скорость.<\/strong> За год системной работы можно выглядеть лучше, чем за 10 лет хаотичных тренировок.<\/li>\n<li><strong>Красота — это пропорции, а не объём.<\/strong> Плечи, талия, осанка и низкий процент жира делают тело атлетичным и без больших бицепсов.<\/li>\n<li><strong>Профессиональный бодибилдинг — не про здоровье.<\/strong> Там риск — часть работы. Наша цель — сильное, выносливое, подвижное тело на долгие годы.<\/li>\n<\/ul>\n<p>Анаболические стероиды подавляют собственный тестостерон и фертильность, нагружают сердце, сосуды и печень. Последствия исправляются долго и не всегда. Если участник уже на курсе или после него, его не осуждаем, а направляем к врачу и на анализы.<\/p>","k":"Знание"},"v8":{"t":"Задать кадр заранее","a":"Зеланд · «Тафти жрица»","h":"<p><b>Тезис.<\/b> Тафти учит не управлять тем, что уже происходит, а задавать грядущий кадр — заранее и систематически. Ключ: сосредоточенность плюс отстранённость. Не давить на реальность.<\/p>\n<p><b>В тренировках.<\/b> Вечером представь завтрашний кадр: ты закончил тренировку, дыхание выровнялось, отметка в приложении стоит. И отпусти эту мысль.<\/p>\n<p><b>Без усилия.<\/b> Решимость нужна не реальности, а тебе. Ты не заставляешь себя — ты просто идёшь в заданный кадр.<\/p>\n<p><b>Практика.<\/b> Перед сном — 10 секунд на завтрашний кадр тренировки. Утром вспомни его и сделай.<\/p>","k":"Взгляд"},"v9":{"t":"Мысль, слово, действие","a":"Уолш · «Беседы с Богом»","h":"<p><b>Тезис.<\/b> У Уолша три инструмента творения: мысль, слово и действие. Когда все три совпадают, реальность складывается быстро. Когда расходятся — буксует.<\/p>\n<p><b>В тренировках.<\/b> Мысль: «я сильный». Слово: не говорить «у меня не получится», «я толстый», «нет времени». Действие: тренировка по плану. Три в одну сторону.<\/p>\n<p><b>Ты — не тело, у тебя есть тело.<\/b> Так говорит Уолш. Тело — инструмент души, и забота о нём — уважение к инструменту, а не культ внешности.<\/p>\n<p><b>Практика.<\/b> Сегодня поймай одну фразу против себя и замени её: «пока не получается» вместо «не получается».<\/p>","k":"Взгляд"}},"ladder":[{"n":0,"t":"Основа","s":"Как всё устроено и с чего начать","l":["b0","v1","b2","b3"]},{"n":3,"t":"Сон и восстановление","s":"Фундамент: без сна остальное не работает","l":["b4","v2"]},{"n":6,"t":"Питание","s":"Своя норма, планы и рецепты","l":["nutrition","b6","v3"]},{"n":10,"t":"Энергия и пищеварение","s":"Откуда берутся силы и как усваивается еда","l":["b8","b9","b10","v4"]},{"n":15,"t":"Анализы","s":"Чекап до любых добавок","l":["b12","v5"]},{"n":20,"t":"Витамины и минералы","s":"Точечно, под дефицит из анализов","l":["b14","b15","v6"]},{"n":25,"t":"Добавки","s":"Что реально работает, а что нет","l":["b17","v7"]},{"n":30,"t":"Гормоны","s":"Тестостерон и честный разговор о стероидах","l":["b19","b20","v8"]},{"n":40,"t":"Мировоззрение","s":"Всё вместе: тело, разум, дух","l":["v9"]}],"nutri":{"instr":"Как рассчитать свою норму (исправленная версия)\n1. Взвеситься утром натощак. Определить % жира визуально по таблице-примеру (или на весах с биоимпедансом).\n2. Базовый обмен — формула Миффлина–Сан Жеора, в неё подставляется ПОЛНЫЙ вес:\n   мужчины: 10 × вес + 6,25 × рост − 5 × возраст + 5\n   женщины: 10 × вес + 6,25 × рост − 5 × возраст − 161\n   Если % жира известен точно, можно считать по Катчу–МакАрдлу: 370 + 21,6 × вес без жира.\n3. Умножить на коэффициент активности: 1,4 — сидячая работа, до 10 000 шагов; 1,55 — активная работа, 10 000+ шагов.\n4. Цель: похудение −20%, набор +20%, поддержание — без изменений.\n5. БЖУ: похудение 35/25/40, поддержание 30/30/40, набор 30/20/50 (% от калорий). Белок 4 ккал/г, жир 9, углеводы 4.\n   Контроль: белок не ниже 1,6 г на кг веса, жиры не ниже 0,8 г на кг.\nПример: мужчина 30 лет, 185 см, 85 кг, сидячая работа, цель похудеть.\n   10×85 + 6,25×185 − 5×30 + 5 = 1 861 ккал × 1,4 = 2 605 ккал (поддержание) − 20% = 2 084 ккал.\n   Б = 2 084×0,35/4 = 182 г · Ж = 2 084×0,25/9 = 58 г · У = 2 084×0,40/4 = 208 г.\nГотовые планы THREGONS рассчитаны на типичного человека 30 лет в своей весовой группе. Если цифра из расчёта отличается от плана больше чем на 150 ккал, подбирайте план соседней группы или меняйте порции гарниров.","rules":["Крупы, мясо и рыба взвешиваются в сыром виде. Яйца — штуками.","1 ст. л. масла = 10 г.","Порции подогнаны под норму с точностью ±3%."],"note":"Нормы: Миффлин по полному весу, 30 лет, активность 1,4; сушка −20%, масса +20%.","plans":[{"group":"Мужчины · сушка","title":"Сушка · 70–80 кг · вариант 1","target":1900,"meals":[{"meal":"Завтрак","items":["Яйцо — 2 шт","Яичный белок — 5 шт","Зелёные овощи/салат — 100 г","Оливковое масло — 10 г","Кускус — 35 г"],"kbju":{"kcal":462,"p":36,"f":20,"c":30}},{"meal":"Перекус 1","items":["Протеин (изолят) — 30 г (1 порц.)","Банан — 90 г","Киви — 50 г","Мёд — 5 г"],"kbju":{"kcal":239,"p":29,"f":1,"c":30}},{"meal":"Обед","items":["Куриная грудка — 140 г","Картофель — 140 г","Зелёные овощи/салат — 200 г","Оливковое масло — 10 г"],"kbju":{"kcal":396,"p":38,"f":13,"c":30}},{"meal":"Перекус 2","items":["Грецкий орех — 20 г","Миндаль — 10 г","Творог 5% — 90 г","Кефир 1% — 200 г","Клетчатка (отруби) — 10 г"],"kbju":{"kcal":400,"p":28,"f":25,"c":13}},{"meal":"Ужин","items":["Сёмга — 140 г","Зелёные овощи/салат — 200 г","Оливковое масло — 10 г"],"kbju":{"kcal":410,"p":30,"f":29,"c":6}}],"total":{"kcal":1906,"p":161,"f":88,"c":109}},{"group":"Мужчины · сушка","title":"Сушка · 70–80 кг · вариант 2","target":1900,"meals":[{"meal":"Завтрак","items":["Яйцо — 2 шт","Яичный белок — 2 шт","Сёмга слабосолёная — 50 г","Хлебцы цельнозерновые — 20 г","Зелёные овощи/салат — 50 г"],"kbju":{"kcal":350,"p":34,"f":16,"c":15}},{"meal":"Перекус 1","items":["Протеин (изолят) — 30 г (1 порц.)","Банан — 100 г","Киви — 50 г","Мёд — 5 г"],"kbju":{"kcal":248,"p":29,"f":1,"c":32}},{"meal":"Обед","items":["Говядина постная — 150 г","Рис белый — 50 г","Зелёные овощи/салат — 200 г","Оливковое масло — 10 г"],"kbju":{"kcal":539,"p":37,"f":23,"c":45}},{"meal":"Перекус 2","items":["Грецкий орех — 20 г","Миндаль — 10 г","Творог 5% — 100 г","Кефир 1% — 200 г","Клетчатка (отруби) — 10 г"],"kbju":{"kcal":412,"p":30,"f":26,"c":13}},{"meal":"Ужин","items":["Тунец стейк — а, а завтра будет лучше, чем сегодня.","по мотивам В. Зеланда"],["Пропуск — не провал, а поворот. Главное, что я вернулся.","по мотивам В. Зеланда"],["Жизнь начинается за пределами зоны комфорта. Один подход — и я уже там.","по мотивам Н. Д. Уолша"],["Не «я должен», а «я выбираю».","по мотивам Н. Д. Уолша"],["Я расту своё тело, как мать растит ребёнка: спокойно и каждый день.","по мотивам В. Зеланда"],["Мысль, слово и действие — в одну сторону.","по мотивам Н. Д. Уолша"],["Моя цель — моя. Я сравниваю себя только с собой вчерашним.","по мотивам В. Зеланда"],["Я не давлю на реальность. Я просто иду в заданный кадр.","по мотивам В. Зеланда"],["У меня есть тело, и я его уважаю. Тренировка — забота об инструменте.","по мотивам Н. Д. Уолша"],["Шаг за шагом. Текущее звено — сегодняшняя тренировка.","по мотивам В. Зеланда"],["Что хочешь получить — дай. Поддержи сегодня кого-то в его пути.","по мотивам Н. Д. Уолша"],["Всё, что случается, — к лучшему. Даже усталость: это сигнал отдохнуть.","по мотивам В. Зеланда"]],"after":["Отметка стоит. Ты выбрал, кем быть, — и сделал это.","Сегодня лучше, чем вчера. Завтра будет лучше, чем сегодня.","Без надрыва и без доказательств. Просто ритм.","Звено цепочки пройдено. Следующее — уже ближе.","Мысль, слово, действие совпали. Так и складывается реальность."],"faq":[["Как устроен путь?","Ты выбираешь, что сейчас в приоритете: база, сила, рост мышц или сушка. С этого этапа начинается твой первый месяц. Каждый этап — 3 месяца, каждый месяц — новый марафон на 4 недели. Дальше этапы идут по кругу. Приоритет можно сменить в любой момент."],["Какие есть уровни?","Старт — новичкам: дома, резинки и ролл. Дом — дома, но сложнее: для тех, кто отжимается и приседает по 10–15 раз без одышки. Улица — турник, брусья, резинки. Зал — тренажёрный зал, вес регулируется."],["Как читать тренировку?","Упражнения сета выполняются подряд — это 1 круг. Число кругов и отдых указаны в тренировке. Прошёл все круги — следующий сет. После всех сетов — заминка."],["Какой уровень выбрать?","По честной оценке своих сил, а не по привычке. Новичкам — «Старт» или «Дом», потом можно перейти в «Зал»: там вес регулируется."],["Можно ли миксовать уровни?","Да. Во всех уровнях дни совпадают: понедельник — грудь и спина, среда — спина и плечи, пятница — ноги и кор. Поэтому можно в понедельник пойти в зал, а в пятницу потренироваться дома — мышцы не пересекутся."],["Что делать в неделю 4?","Это разгрузка: кругов меньше, техника чище. В пятницу — финиш месяца: тест или челлендж. Так тело закрепляет результат и свежим заходит в следующий месяц."],["Что, если в месяце больше четырёх недель?","Оставшиеся дни — свободные: повтори любимую тренировку месяца или сделай день восстановления."],["Когда тренироваться?","В любое удобное время: утро, обед или вечер. Важнее регулярность, чем время."],["Что входит в тарифы?","Марафон месяца: тренировки твоего месяца, основы базы знаний — старт, сон и восстановление, питание — и польза недели. «Путь 90 дней»: всё — программа на 12 недель с лекциями и тестами, вся база знаний, гайды и марафоны."],["Можно ли сменить приоритет?","Да, один раз за оплаченный месяц. Новый этап начнётся с первого месяца. Если до конца оплаченного месяца осталось меньше 15 дней, этот первый месяц продолжится и в следующем."]],"sources":"<ul>\n<li><a href=\"https://www.endocrine.org/news-and-advocacy/news-room/2024/endocrine-society-recommends-healthy-adults-take-the-recommended-daily-allowance-of-vitamin-d\">Endocrine Society: витамин D для профилактики, рекомендации 2024<\/a><\/li>\n<li><a href=\"https://ods.od.nih.gov/factsheets/zinc-consumer/\">NIH ODS: цинк — нормы и верхний предел<\/a><\/li>\n<li><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/5469049/\">ISSN: безопасность и эффективность креатина (2017)<\/a><\/li>\n<li><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/7777221/\">ISSN: кофеин и физическая работоспособность (2021)<\/a><\/li>\n<li>&#91;ISSN: бета-аланин (2015)](https://jissn.biomedcentral.com/counter/pdf/10.1186/s12970-015-0090-y .pdf)<\/li>\n<li><a href=\"https://pubmed.ncbi.nlm.nih.gov/33383165/\">Reed et al., 2021: соя и гормоны мужчин, мета-анализ<\/a><\/li>\n<li><a href=\"https://pubmed.ncbi.nlm.nih.gov/12472620/\">Gonzales et al., 2002: мака, либидо и тестостерон<\/a><\/li>\n<li><a href=\"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10002162/\">Ашваганда и поражение печени, клинический случай 2023<\/a><\/li>\n<li><a href=\"https://www.mskcc.org/cancer-care/integrative-medicine/herbs/5-HTP-01\">MSKCC: 5-HTP — взаимодействия и риски<\/a><\/li>\n<li>\n<p><a href=\"https://www.usada.org/spirit-of-sport/meldonium/\">USADA: мельдоний в запрещённом списке WADA<\/a><\/p>\n<\/li>\n<li>\n<p>Bondonno N.P. et al. Flavonoid intake is associated with lower mortality in the Danish Diet Cancer and Health Cohort. Nature Communications, 2019.<\/p>\n<\/li>\n<li>Kreider R.B. et al. ISSN position stand: safety and efficacy of creatine supplementation. JISSN, 2017 (креатин и мочевая кислота).<\/li>\n<\/ul>","p90":{"meta":{"brand":"THREGONS","title":"THREGONS 84","subtitle":"12 недель = 4 этапа по 21 дню","version":"2.5 — полная база GIF TRAIN","language":"ru","note":"Авторская программа Руслана (THREGONS). Основа — разобранные по сетам тренировки купленного курса, переработанные: исправлены ошибки, снижены травмоопасные объёмы, добавлены уровни, восстановление и тесты."},"phil":["Главное в прогрессии — постоянство и регулярность. Пропущенная тренировка хуже лёгкой.","Недели 3, 7 и 9 облегчённые. Это часть плана, а не слабость: тело закрепляет то, что набрало.","Не можешь сделать всё — сделай минимум: один сет и два круга. День засчитан.","Тело, разум, дух: тренировка, восстановление и голова работают вместе."],"rules":["Сет — это связка упражнений подряд без отдыха. Прошёл связку — это один круг.","Число кругов на неделю указано в расписании.","Перед тренировкой — разминка 5–7 минут, после — 5 минут растяжки и 2 минуты спокойного дыхания.","Боль в суставе — не усталость. Останови упражнение и замени его."],"model":{"blocks":["Свой вес — дом, ничего не нужно","Воркаут — турник и брусья","Зал — штанга, гантели, тренажёры"],"set":"Сет — связка упражнений подряд без отдыха. Прошёл связку — один круг.","cooldown":"После каждой тренировки: 5 мин растяжки и 2 мин дыхания с длинным выдохом.","pain_rule":"Боль в суставе — не усталость. Останови упражнение и замени его."},"levels":{"super_light":{"name":"Супер лайт","for":"Полный новичок или большой перерыв","time":"20–25 мин","where":"дом: свой вес и резина","sets":2,"rest":"до 90 сек между кругами","week":"Пн, Ср, Пт — тренировка; Вт и Сб — прогулка 20–30 мин; Чт — растяжка; Вс — отдых"},"base":{"name":"База","for":"Занимался раньше, умеет отжиматься от пола","time":"40–45 мин","where":"дом или площадка, резина и гиря","sets":4,"rest":"60–90 сек между кругами"},"pro":{"name":"Про","for":"Опыт от года, есть доступ в зал","time":"55–65 мин","where":"площадка и зал","sets":6,"rest":"60–120 сек между кругами"},"how_to_switch":"Закрыл все три недели этапа без пропусков и тест вырос — переходи на уровень выше со следующего этапа.","max":{"name":"Макс","for":"Опытные, которые хорошо восстанавливаются","time":"90–120 мин","note":"Все 3 блока целиком. Не чаще 1 раза в неделю."}},"stages":[{"n":1,"name":"Месяц 1. Фундамент","weeks":[1,2,3,4],"goal":"Техника, привычка, три блока. Неделя 3 облегчённая, неделя 4 — проверка.","motto":"Не геройствуй. Просто приходи."},{"n":2,"name":"Месяц 2. Сила","weeks":[5,6,7,8],"goal":"Сплит по мышцам, объём по кругу, тест месяца на 7-й неделе (она же облегчённая: два тяжёлых дня).","motto":"Сила растёт между тренировками."},{"n":3,"name":"Месяц 3. Пик","weeks":[9,10,11,12],"goal":"Старт финального месяца, вторая волна сплита, интенсив и финальный тест со сравнением результатов.","motto":"Ты уже другой. Проверь это."}],"weeks":[{"w":1,"m":1,"t":"Вход в систему","idea":"Знакомимся с тремя блоками и ставим технику. Темп спокойный, без отказа.","light":false,"lec":"L01","days":[{"dn":"Пн",
