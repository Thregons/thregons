e_ids":["ex132"]},{"name":"Вис на турнике на время","exercise_ids":["ex096"]},{"name":"Подтягивания или австралийские подтягивания, максимум","exercise_ids":["ex045","ex157"]},{"name":"1 км ходьбой или бегом на время","exercise_ids":[]}]},"lect":{"L01":{"id":"L01","week":1,"area":"психология","title":"Регулярность сильнее мотивации","about":"Мотивация — это погода: сегодня есть, завтра нет. Результат делает система, которая работает в любую погоду.","dur":"","sections":[{"h":"Почему мотивация подводит","items":["Мотивация — эмоция. Она падает от недосыпа, стресса, плохой новости. Строить на ней 12 недель — как строить дом на песке.","Привычка — это действие, которое мозг запускает сам, почти без усилия. Чтобы её сформировать, нужны в среднем 2 месяца, у разных людей — от 3 недель до 8 месяцев. Поэтому программа длится 12 недель."]},{"h":"Как строится привычка","items":["Сигнал → действие → награда. Сигнал — время или место («после утреннего кофе — зарядка»). Награда — отметка в календаре, чувство «я сделал».","Привязывай новое к тому, что уже делаешь каждый день: после чистки зубов, после работы, перед душем.","Делай действие проще, а не героичнее. Форма на виду, коврик расстелен, тренировка выбрана с вечера."]},{"h":"Правило минимума THREGONS","items":["Плохой день — не повод пропустить. Повод сделать минимум: один сет, два круга.","Пропуск ломает цепочку, минимум её сохраняет. Через месяц важно не то, сколько раз было тяжело, а сколько раз ты пришёл.","Никогда не пропускай два раза подряд."]},{"h":"Окружение решает","items":["Ты — среднее от людей и пространства вокруг. Чат марафона, отчёты, партнёр по тренировкам повышают шанс дойти до конца.","Убери из дома то, что тянет назад, и поставь на виду то, что тянет вперёд."]}],"practice":"Выбери время и место для тренировок на всю программу и запиши фразу: «В [дни] в [время] в [место] я тренируюсь». Повесь её на видное место.","quiz":[{"q":"Сколько в среднем формируется привычка?","options":["7 дней","21 день","Около 2 месяцев"],"answer":2},{"q":"Что делать в день, когда совсем нет сил?","options":["Пропустить","Минимум: один сет и два круга","Сделать двойную тренировку завтра"],"answer":1},{"q":"Главное правило пропусков?","options":["Не пропускать два раза подряд","Пропускать не больше раза в неделю","Пропуски не важны"],"answer":0}],"sources":[]},"L02":{"id":"L02","week":2,"area":"физиология","title":"Как растёт мышца и зачем нужен отдых","about":"На тренировке ты мышцу не строишь, а разрушаешь. Строится она потом — во сне, в еде и в дни отдыха.","dur":"","sections":[{"h":"Что происходит на тренировке","items":["Нагрузка создаёт сигнал: «нужно быть сильнее». Микроповреждения волокон, механическое напряжение и усталость запускают синтез белка.","Синтез мышечного белка повышен 24–48 часов после силовой. В это время и нужны белок и сон."]},{"h":"Суперкомпенсация","items":["После нагрузки силы падают, затем восстанавливаются — и немного превышают исходный уровень. Следующая тренировка в этой точке даёт рост.","Тренируешься слишком часто — не успеваешь восстановиться, форма падает. Слишком редко — эффект уходит.","Поэтому в программе 3 силовых в неделю, а не 6."]},{"h":"Прогрессия","items":["Мышце нужна постепенно растущая нагрузка: повторы, круги, сложность упражнения, вес, темп.","Добавляй понемногу: +1–2 повтора или один круг. Резкий рост нагрузки — путь к травме.","Оставляй 1–2 повтора в запасе. Работа «до отказа» в каждом подходе не даёт больше роста, но сильнее утомляет."]},{"h":"Зачем облегчённые недели","items":["Усталость накапливается быстрее, чем растёт форма. Облегчённая неделя снимает усталость, и форма «проявляется».","Признаки, что нужен отдых вне плана: сон хуже, пульс покоя выше обычного на 5–10 ударов, раздражительность, нет желания тренироваться, веса «потяжелели»."]}],"practice":"Каждое утро в эту неделю измеряй пульс сразу после пробуждения, лёжа, 1 минуту. Запиши — это твоя базовая цифра для контроля перегруза.","quiz":[{"q":"Когда растёт мышца?","options":["Во время тренировки","В период восстановления","Только во сне"],"answer":1},{"q":"Сколько повторов оставлять в запасе в обычном подходе?","options":["0","1–2","5"],"answer":1},{"q":"Пульс покоя выше обычного на 5–10 ударов — это?","options":["Норма","Признак недовосстановления","Признак хорошей формы"],"answer":1}],"sources":[{"title":"Белок и рост мышц: метаанализ Morton (2018)","url":"https://pubmed.ncbi.nlm.nih.gov/28698222/"}]},"L03":{"id":"L03","week":3,"area":"физиология","title":"Кости, суставы и позвоночник","about":"Как устроен скелет, почему кость крепнет от нагрузки и что реально помогает суставам и спине, а что — миф.","dur":"20–25 минут чтения","sections":[{"h":"1. Скелет за минуту","items":["У взрослого 206 костей. Осевой скелет — череп, позвоночник, рёбра, грудина — защищает мозг и органы. Добавочный скелет — руки, ноги, плечевой пояс и таз — отвечает за движение.","Функции кости: опора, рычаги для мышц, защита органов, склад кальция и фосфора, производство клеток крови в красном костном мозге.","Мышца крепится к кости сухожилием, кость к кости — связкой. Мышца тянет сухожилие, сухожилие двигает кость. Это и есть движение."]},{"h":"2. Кость живая и перестраивается","items":["Остеобласты строят кость, остеокласты разбирают старую. За год обновляется около 10% скелета.","Компактная кость — плотная оболочка. Губчатая — внутренняя решётка, её перегородки выстраиваются по линиям нагрузки.","Закон Вольфа: кость укрепляется там, где на неё действует нагрузка, и слабеет без неё. У лежачих больных и космонавтов кость теряет массу за недели."]},{"h":"3. Что укрепляет кости — по доказательствам","items":["Силовые с прогрессией нагрузки и прыжковая работа (приседания, выпады, трастеры, прыжки, бёрпи). Исследования показывают рост минеральной плотности даже у людей с остеопенией — при правильной технике и под контролем.","Белок 1,2–1,6 г на кг веса в день: кость на треть состоит из белкового каркаса.","Кальций около 1000 мг в день из еды: творог, сыр, кефир, рыба с костями, кунжут, зелень.","Витамин D: солнце, рыба, яйца. Добавки — по анализу 25(OH)D, это есть в блоке «Чекап».","Сон и нормальный вес. Курение и регулярный алкоголь ускоряют потерю костной массы.","Хронический стресс и долгий приём стероидных препаратов через кортизол разрушают кость — ещё одна причина держать восстановление в приоритете."]},{"h":"4. Позвоночник","items":["24 подвижных позвонка: 7 шейных, 12 грудных, 5 поясничных; ниже — сросшиеся крестец и копчик. Между позвонками — диски-амортизаторы.","Утром диски больше всего насыщены водой и чувствительнее к нагрузке. Практический вывод: первые 30–60 минут после подъёма не делай тяжёлых наклонов и становой тяги.","Естественные изгибы — шейный и поясничный лордоз, грудной кифоз — это норма. Проблемой становится их усиление (гиперкифоз — «сутулость», гиперлордоз) или боковое искривление — сколиоз.","Против сутулости работают тяги, лодочка, ласточка, махи на заднюю дельту, сведение лопаток — они есть в программе каждую неделю."]},{"h":"5. Суставы и артроз","items":["Остеоартроз — износ хряща сустава: боль при нагрузке, скованность по утрам до 30 минут.","Лучшее средство по доказательствам — упражнения (сила мышц вокруг сустава) и снижение веса: минус 1 кг веса снимает с колена около 4 кг нагрузки при каждом шаге.","Покой при артрозе не помогает — ухудшает. Двигаться надо, но без острой боли.","Ревматоидный артрит — другое заболевание: воспаление, обычно симметрично (обе кисти, оба колена), утренняя скованность больше часа. Это к ревматологу, не в тренажёрный зал."]},{"h":"6. Травмы","items":["Перелом — повреждение кости; растяжение — повреждение связки; надрыв мышцы — повреждение мышцы.","Признаки, при которых тренировку прекращаешь и идёшь к врачу: резкая боль в момент движения, щелчок, отёк, деформация, нельзя опереться на конечность.","Кость срастается 6–12 недель. Возвращение к нагрузке — постепенно и после разрешения врача.","Стрессовый перелом — от резкого роста нагрузки, особенно бега и прыжков. Ноющая точечная боль в голени или стопе, которая растёт с каждой тренировкой, — повод остановиться. Поэтому в программе есть облегчённые недели."]},{"h":"7. Мифы, которые стоит знать","items":["«Щелочная диета укрепляет кости» — нет. Метаанализы не нашли, что «закисляющая» еда вымывает кальций из костей.","«Кофе разрушает кости» — 2–3 чашки в день при нормальном кальции в рационе не вредят.","«Гомеопатия и арника сращивают переломы» — гомеопатия не работает лучше плацебо. Мазь с арникой может немного снять синяк, но на срастание кости не влияет.","«Окопник внутрь для костей и суставов» — опасно: он содержит пирролизидиновые алкалоиды, которые разрушают печень. Внутренний приём запрещён во многих странах.","«Хрустят суставы — значит, они изнашиваются» — безболезненный хруст обычно безвреден. Тревожный сигнал — хруст с болью или отёком."]}],"practice":"","quiz":[{"q":"Какие клетки строят кость?","options":["Остеокласты","Остеобласты","Остеоциты"],"answer":1},{"q":"Что происходит с костью без нагрузки?","options":["Ничего","Она укрепляется","Она теряет массу"],"answer":2},{"q":"Когда диски позвоночника наиболее чувствительны к тяжёлым наклонам?","options":["Утром после сна","Вечером","После обеда"],"answer":0},{"q":"Что лучше всего помогает при артрозе колена?","options":["Полный покой","Упражнения и снижение веса","Щелочная диета"],"answer":1},{"q":"Сколько подвижных позвонков у человека?","options":["33","24","12"],"answer":1}],"sources":[{"title":"Метаанализ: гипотеза «кислотной золы» и баланс кальция","url":"https://pubmed.ncbi.nlm.nih.gov/19419322/"},{"title":"Окопник: токсичность для печени при приёме внутрь","url":"https://mountsinai.org/health-library/herb/comfrey"},{"title":"Силовые с высокой нагрузкой и плотность костей при остеопении: метаанализ","url":"https://ouci.dntb.gov.ua/works/4ERaBoxl"}]},"L04":{"id":"L04","week":4,"area":"гормоны","title":"Сон: режим, гормоны ночи и подъём без будильника","about":"Ночью работает главная «аптека» организма: гормон роста, тестостерон, восстановление мозга. Твоя задача — не мешать ей.","dur":"","sections":[{"h":"Что происходит ночью","items":["Первая половина ночи — больше глубокого сна: выброс гормона роста, восстановление тканей.","Вторая половина — больше быстрого сна: память, эмоции, обучение движениям.","Тестостерон у мужчин растёт во сне. Неделя сна по 5 часов снижает его на 10–15% — как старение на 10–15 лет."]},{"h":"Циркадный ритм","items":["Внутренние часы управляют сном, температурой, гормонами и голодом. Главные «настройщики» — свет утром и темнота вечером.","Мелатонин вырабатывается в темноте. Яркий свет вечером его подавляет и сдвигает сон позже."]},{"h":"Как просыпаться без будильника","items":["Это не сила воли, а следствие: высыпаешься и встаёшь в одно и то же время — тело начинает просыпаться само за несколько минут до нужного времени.","Шаг 1: определи время подъёма и отсчитай назад 7,5–8,5 часа — это время, когда ты ложишься.","Шаг 2: держи это время 7 дней в неделю, разброс не больше 30–60 минут.","Шаг 3: сразу после подъёма — свет в глаза 10–30 минут (улица, балкон, открытые шторы).","Шаг 4: будильник пока оставь как страховку. Через 2–3 недели стабильного режима ты будешь просыпаться раньше него.","Если без будильника не встаёшь совсем — ты недосыпаешь. Ложись на 30 минут раньше."]},{"h":"Сон и тренировки","items":["Недосып снижает силу, скорость реакции и мотивацию и повышает аппетит к сладкому.","В ночь после тяжёлой тренировки сон особенно важен. Не ставь тяжёлые силовые позднее чем за 2–3 часа до сна."]},{"h":"Подробности","items":["Полный гайд по ритуалу сна, хронотипам и сменному графику — в разделе «Гайды → Сон»."]}],"practice":"Выбери время подъёма на все оставшиеся недели. Посчитай время отбоя. 7 дней подряд держи оба времени и отмечай их в трекере сна.","quiz":[{"q":"Когда больше всего выделяется гормон роста?","options":["В первой половине ночи, в глубоком сне","Утром перед подъёмом","Днём после еды"],"answer":0},{"q":"Главный настройщик внутренних часов?","options":["Еда","Свет","Кофе"],"answer":1},{"q":"Что значит, если без будильника не встаёшь вообще?","options":["Ты сова","Ты недосыпаешь","Это норма"],"answer":1}],"sources":[{"title":"Недосып и тестостерон (JAMA, 2011)","url":"https://www.sciencedaily.com/releases/2011/05/110531162142.htm"},{"title":"Недосып, лептин и грелин","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4434546"}]},"L05":{"id":"L05","week":5,"area":"режим","title":"Утро, которое работает: свет, вода, холод","about":"Первый час после подъёма задаёт тон всему дню. Не нужен сложный ритуал — нужен простой и одинаковый.","dur":"","sections":[{"h":"Базовое утро THREGONS","items":["Встал сразу, без «ещё 5 минут» и без телефона в первые 15 минут.","Стакан воды, 300–500 мл.","Свет в глаза 10–30 минут: улица или окно. В пасмурный день — дольше.","Зарядка 5–10 минут: суставная разминка, несколько приседаний и отжиманий.","Заправленная постель — первая выполненная задача дня.","Кофе — через 60–90 минут после подъёма: так меньше «провал» днём."]},{"h":"Холодный душ: что доказано","items":["В большом рандомизированном исследовании в Нидерландах люди, которые 30 дней заканчивали душ холодной водой (30–90 секунд), брали на 29% меньше больничных. Количество дней болезни при этом не изменилось — люди легче переносили болезнь.","Холод бодрит: резко растут норадреналин и пульс, улучшается настроение на 1–2 часа.","Влияние на «сжигание жира» и иммунитет в целом — данные слабые, чудес не жди."]},{"h":"Холод: как начать грамотно","items":["Начни с 10 секунд холодной воды в конце обычного тёплого душа.","Каждые 3 дня добавляй 5 секунд, цель — 1 минута.","Дыши медленно и длинно на выдох, не задерживай дыхание.","Начинай с ног и рук, потом спина, грудь и голова."]},{"h":"Холод: когда нельзя","items":["Сразу после силовой: холодная вода снижает рост мышц и силы (это показал метаанализ 2024 года). Между силовой и холодом — минимум 4–6 часов, лучше холод утром, а силовую — вечером, или в дни без силовых.","Болезни сердца и сосудов, высокое давление, синдром Рейно, простуда с температурой — только после разговора с врачом.","Ледяная прорубь без подготовки и в одиночку — никогда."]}],"practice":"Неделя: каждое утро — вода, свет, зарядка. Холодный душ — 10 секунд, затем +5 секунд каждые 3 дня. В дни силовых — утром, если тренировка вечером.","quiz":[{"q":"Через сколько после подъёма лучше пить кофе?","options":["Сразу","Через 60–90 минут","Только после обеда"],"answer":1},{"q":"Когда не стоит делать холодный душ?","options":["Утром","Сразу после силовой","В день отдыха"],"answer":1},{"q":"С чего начинать холодный душ?","options":["С 3 минут ледяной воды","С 10 секунд в конце тёплого душа","С проруби"],"answer":1}],"sources":[{"title":"Холодный душ и больничные: рандомизированное исследование (PLOS One, 2016)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5025014"},{"title":"Холодная вода после силовой снижает рост мышц: метаанализ (2024)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11235606/"}]},"L06":{"id":"L06","week":6,"area":"гормоны","title":"Кортизол, стресс и нервная система","about":"Тело не различает стресс от начальника, недосыпа и тяжёлой тренировки — всё падает в одну копилку. Переполнил копилку — прогресс стоит.","dur":"","sections":[{"h":"Кортизол — не враг","items":["Кортизол поднимает нас утром, даёт энергию и мобилизует на нагрузку. Утренний пик — норма.","Проблема — хронически высокий кортизол: плохой сон, тяга к сладкому, жир на животе, слабый иммунитет, потеря мышц."]},{"h":"Две ветви нервной системы","items":["Симпатическая — «бей или беги»: пульс, давление, мобилизация. Нужна на тренировке и в работе.","Парасимпатическая — «отдых и восстановление»: пищеварение, сон, рост. Именно в ней растут мышцы.","Современный человек застревает в «бей или беги». Задача — научиться переключаться."]},{"h":"Рычаг №1: дыхание","items":["Выдох активирует парасимпатику. Длинный выдох — самый быстрый способ успокоиться.","Циклический вздох: два вдоха носом подряд (второй короткий, «добор»), затем длинный медленный выдох ртом. 5 минут в день. В исследовании Стэнфорда (2023) это упражнение улучшало настроение лучше, чем медитация той же длительности.","Дыхание 4–6: вдох 4 секунды, выдох 6–8 секунд. После каждой тренировки 2 минуты."]},{"h":"Рычаг №2: копилка стресса","items":["Посмотри, что сейчас в копилке: работа, сон, деньги, отношения, тренировки, вахта.","Если стресс в жизни высокий (аврал, переезд, болезнь близких) — бери уровень на ступень ниже. Это не слабость, это управление нагрузкой.","Восстанавливают: сон, прогулка на природе, общение с близкими, 10 минут тишины, баня по самочувствию."]},{"h":"Признаки перегруза","items":["Плохо засыпаешь при усталости, просыпаешься в 3–4 утра.","Пульс покоя выше обычного, раздражительность, нет аппетита или наоборот тянет на сладкое.","Два-три признака несколько дней — день отдыха вне плана."]}],"practice":"Каждый день: 5 минут циклических вздохов (утром или днём) и 2 минуты дыхания 4–6 после тренировки. В конце недели отметь, как изменился сон.","quiz":[{"q":"В какой ветви нервной системы растут мышцы?","options":["Симпатической","Парасимпатической","Ни в какой"],"answer":1},{"q":"Как выглядит циклический вздох?","options":["Два вдоха носом и длинный выдох ртом","Задержка дыхания на 2 минуты","Частое дыхание ртом"],"answer":0},{"q":"Что делать, если в жизни аврал?","options":["Тренироваться больше","Взять уровень на ступень ниже","Бросить программу"],"answer":1}],"sources":[{"title":"Циклические вздохи и настроение: Стэнфорд (2023)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9873947"}]},"L07":{"id":"L07","week":7,"area":"психология","title":"Скука, тишина и творчество","about":"Мы разучились скучать: каждая пауза заполняется телефоном. А именно в паузе мозг собирает идеи, переваривает опыт и восстанавливается.","dur":"","sections":[{"h":"Что делает мозг, когда «ничего не делает»","items":["Когда ты не занят задачей, включается сеть пассивного режима работы мозга. Она связывает воспоминания, планы и идеи — отсюда озарения в душе и на прогулке.","Постоянный поток коротких видео и уведомлений не даёт этой сети работать: мозг всё время реагирует и не успевает думать."]},{"h":"Что говорят исследования","items":["В экспериментах после скучного задания люди придумывали больше идей, чем без него: скука толкает мозг искать смысл и новизну.","В известном исследовании 2014 года многие участники предпочли бить себя током, лишь бы не сидеть 15 минут наедине с мыслями. Навык быть с собой — тренируется, как мышца."]},{"h":"Практика «10 минут тишины»","items":["Сядь без телефона, без музыки, без книги. Можно маска и беруши.","Не нужно медитировать «правильно». Просто сиди и наблюдай мысли.","В конце задай себе один вопрос («Что сейчас важно?», «Чего я избегаю?») и запиши 1–3 строки.","Начни с 10 минут. Когда станет легко — 20–30 минут, раз в неделю можно 40 минут прогулки без наушников."]},{"h":"Рисование и ручная работа","items":["Рисование, лепка, музыка руками снижают уровень стресса и тренируют внимание. Умение рисовать не нужно — важен процесс.","Простой вариант: 10–15 минут вечером рисовать что угодно ручкой в блокноте, без цели и оценки.","Подходит как замена телефону перед сном."]},{"h":"Дофаминовая гигиена","items":["Убери уведомления со всех приложений, кроме звонков и сообщений близких.","Первые 15 минут утра и последний час вечера — без телефона.","Одна задача за раз: тренировка без ленты между подходами."]}],"practice":"Каждый день: 10 минут тишины без телефона, в конце — один вопрос и 1–3 строки в блокнот. Два вечера на неделе — 10 минут рисования вместо телефона.","quiz":[{"q":"Что включается в мозге, когда ты не занят задачей?","options":["Ничего","Сеть пассивного режима: идеи, связи, планы","Только сон"],"answer":1},{"q":"Что делать в «10 минутах тишины»?","options":["Слушать подкаст","Сидеть без стимулов и наблюдать мысли","Листать ленту медленно"],"answer":1},{"q":"Зачем рисовать, если не умеешь?","options":["Незачем","Важен процесс: снижает стресс и тренирует внимание","Чтобы продавать картины"],"answer":1}],"sources":[{"title":"Скука и креативность: обзор исследований","url":"https://nautil.us/how-meaning-withdrawal-aka-boredom-can-boost-creativity-235244"}]},"L08":{"id":"L08","week":8,"area":"физиология","title":"Сердце и выносливость: зачем спокойное кардио","about":"Сильные мышцы без выносливого сердца — как мощный двигатель без бака. Спокойное кардио строит этот бак.","dur":"","sections":[{"h":"Зона 2","items":["Это темп, в котором можешь говорить фразами, но петь уже трудно. Примерно 60–70% от максимального пульса.","В этой зоне растёт число митохондрий — «электростанций» клетки — и капилляров. Улучшается способность сжигать жир как топливо.","Именно поэтому во вторник и четверг — спокойное кардио, а не изматывающее."]},{"h":"Как считать пульс","items":["Простая формула максимума: 220 минус возраст. Неточная, но для старта хватит.","Зона 2 ≈ 60–70% от этого числа. Для 36 лет: максимум около 184, зона 2 — 110–130 ударов.","Без пульсометра — тест разговора: говоришь фразами — ты в зоне."]},{"h":"Интенсивное кардио","items":["Интервалы, бокс, скакалка, кроссфит повышают максимальное потребление кислорода (МПК) — один из сильнейших показателей долголетия.","Хватает 1–2 интенсивных занятий в неделю. Больше — мешает восстановлению после силовых."]},{"h":"Шаги","items":["Метаанализ 15 больших исследований (2022): риск смерти снижается с ростом шагов и выходит на плато около 6–8 тысяч в день после 60 лет и 8–10 тысяч до 60.","В дни отдыха — цель от 8 000 шагов."]},{"h":"Пульс покоя","items":["Снижение пульса покоя за 12 недель — хороший признак: сердце работает экономнее.","Записывай его раз в неделю утром."]}],"practice":"На этой неделе одно кардио проведи строго в зоне 2 по тесту разговора. Посчитай свои шаги за 3 дня и найди среднее.","quiz":[{"q":"Как понять, что ты в зоне 2 без пульсометра?","options":["Можешь петь","Говоришь фразами","Не можешь сказать ни слова"],"answer":1},{"q":"Сколько интенсивных кардио в неделю достаточно?","options":["1–2","5–6","Каждый день"],"answer":0},{"q":"Сколько шагов в день — цель для дня отдыха?","options":["2 000","От 8 000","30 000"],"answer":1}],"sources":[{"title":"Шаги и смертность: метаанализ 15 когорт (Lancet, 2022)","url":"https://discovery.ucl.ac.uk/id/eprint/10170017/1/1-s2.0-S2468266721003029-main.pdf"}]},"L09":{"id":"L09","week":9,"area":"гормоны","title":"Тестостерон без мифов","about":"Тестостерон — не только про мышцы. Это энергия, настроение, либидо, плотность костей. И на большую часть факторов ты влияешь сам.","dur":"","sections":[{"h":"Что реально снижает тестостерон","items":["Недосып: неделя по 5 часов сна — минус 10–15%.","Лишний жир на животе: жировая ткань превращает тестостерон в эстрогены.","Хронический стресс и высокий кортизол.","Регулярный алкоголь.","Сильный дефицит калорий надолго и очень низкое количество жиров в рационе.","Перетренированность без восстановления."]},{"h":"Что помогает","items":["Сон 7–9 часов.","Силовые тренировки с базовыми упражнениями.","Снижение лишнего веса.","Достаточно калорий, белка и жиров (не меньше 0,8 г на кг веса).","Витамин D и цинк — если анализ показывает дефицит."]},{"h":"Мифы","items":["«Бустеры тестостерона» из спортивного магазина — у здоровых мужчин большинство не повышает тестостерон заметно.","Ашваганда может немного повысить его у части мужчин с низким уровнем, данные пока ограничены.","«Воздержание повышает тестостерон» — эффект кратковременный и небольшой."]},{"h":"Когда к врачу","items":["Постоянная усталость, сниженное либидо, потеря мышц, депрессивное настроение — повод сдать анализы (общий тестостерон утром натощак, ГСПГ, ЛГ) и пойти к эндокринологу или урологу.","Самостоятельный приём гормонов без врача отключает собственную выработку и опасен для сердца."]}],"practice":"Посмотри на свою неделю: сколько ночей ты спал 7+ часов, сколько раз был алкоголь, сколько силовых сделал. Исправь одно слабое место на следующую неделю.","quiz":[{"q":"Что сильнее всего снижает тестостерон из списка?","options":["Силовые тренировки","Хронический недосып","Белок"],"answer":1},{"q":"Работают ли «бустеры тестостерона» у здоровых мужчин?","options":["Да, сильно","В большинстве случаев заметно не работают","Да, это гормоны"],"answer":1},{"q":"Почему лишний жир на животе снижает тестостерон?","options":["Жир превращает тестостерон в эстрогены","Жир блокирует сон","Не снижает"],"answer":0}],"sources":[{"title":"Недосып и тестостерон (JAMA, 2011)","url":"https://www.sciencedaily.com/releases/2011/05/110531162142.htm"}]},"L10":{"id":"L10","week":10,"area":"гормоны","title":"Инсулин, сахар и энергия в течение дня","about":"Сонливость после обеда, тяга к сладкому вечером, «нет сил» — часто дело не в лени, а в том, как и что ты ешь.","dur":"","sections":[{"h":"Что делает инсулин","items":["После еды сахар крови растёт, инсулин помогает ему зайти в мышцы и печень.","Мышцы — главный «склад» сахара. Чем больше мышц и чем чаще они работают, тем лучше чувствительность к инсулину."]},{"h":"Откуда провалы энергии","items":["Быстрые углеводы без белка и клетчатки — резкий подъём сахара и такое же падение. Падение = сонливость и голод.","Недосып на 1–2 ночи ухудшает чувствительность к инсулину и усиливает тягу к сладкому."]},{"h":"Как выстроить день","items":["Белок и овощи в каждом приёме пищи. Углеводы — после них или вместе с ними.","Сладкое — после основного приёма пищи, а не отдельно на перекус.","10–15 минут ходьбы после еды заметно снижают подъём сахара.","Самые «быстрые» углеводы лучше ставить вокруг тренировки."]},{"h":"Признаки, что пора к врачу","items":["Постоянная жажда, частое мочеиспускание, долго заживающие раны, сонливость после любой еды.","Анализы: глюкоза натощак и гликированный гемоглобин есть в блоке «Чекап»."]}],"practice":"Неделя: после обеда и ужина — 10 минут ходьбы. Сладкое — только после основного приёма пищи. Отметь, как изменилась энергия во второй половине дня.","quiz":[{"q":"Где хранится основная часть сахара после еды?","options":["В мышцах и печени","В жире","В крови"],"answer":0},{"q":"Что сильнее всего снижает подъём сахара после еды?","options":["Лечь полежать","10–15 минут ходьбы","Кофе"],"answer":1},{"q":"Когда лучше есть сладкое?","options":["Отдельно на перекус","После основного приёма пищи","На ночь"],"answer":1}],"sources":[{"title":"Недосып, лептин и грелин","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4434546"}]},"L11":{"id":"L11","week":11,"area":"физиология","title":"Иммунитет, холод и тренировки","about":"Тренировки — лучший долгосрочный «иммуномодулятор». Но тяжёлая неделя без сна может временно ослабить защиту.","dur":"","sections":[{"h":"Как нагрузка влияет на иммунитет","items":["Регулярная умеренная активность связана с меньшим числом простуд и более лёгким течением болезней.","Очень тяжёлая нагрузка + недосып + стресс — окно уязвимости на несколько дней. Поэтому в интенсив сон и еда важнее всего."]},{"h":"Правило «выше шеи»","items":["Насморк, лёгкое першение без температуры — можно лёгкую тренировку или прогулку.","Температура, ломота, кашель, боль в груди — тренировка отменяется.","После болезни с температурой — 2–3 дня без нагрузки после нормальной температуры, затем облегчённая неделя.","Тренироваться с температурой опасно: есть риск воспаления сердечной мышцы."]},{"h":"Что поддерживает иммунитет","items":["Сон 7–9 часов — первое средство.","Белок, овощи, фрукты, достаточно калорий.","Витамин D по анализу.","Свежий воздух, дневной свет.","Холодный душ: меньше больничных, но не меньше дней болезни."]},{"h":"Баня и сауна","items":["Наблюдательные исследования из Финляндии связывают частую сауну с меньшим риском сердечно-сосудистых болезней. Это связь, а не доказанная причина, но сауна в разумных дозах безопасна для здоровых людей.","15–20 минут, 2–3 захода, вода. Без алкоголя. Не сразу после тяжёлой тренировки, если кружится голова."]}],"practice":"Проверь три вещи этой недели: сон 7+ часов, белок в каждом приёме пищи, свежий воздух каждый день. Отметь, что не получилось, и исправь на неделе 12.","quiz":[{"q":"Можно ли тренироваться с температурой?","options":["Да","Нет, это опасно для сердца","Только кардио"],"answer":1},{"q":"Что делать при лёгком насморке без температуры?","options":["Лёгкая тренировка или прогулка","Двойная тренировка","Строгий постельный режим"],"answer":0},{"q":"Главное средство для иммунитета?","options":["Витамин C в больших дозах","Сон","Антибиотики"],"answer":1}],"sources":[{"title":"Холодный душ и больничные: рандомизированное исследование (PLOS One, 2016)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5025014"}]},"L12":{"id":"L12","week":12,"area":"психология","title":"Срыв, возвращение и жизнь после программы","about":"Программа заканчивается, а ты — нет. Самое ценное за 12 недель — не цифры теста, а то, что ты научился возвращаться.","dur":"","sections":[{"h":"Срыв — часть пути","items":["Срывы бывают у всех. Отличие тех, кто добивается результата, — они возвращаются быстрее.","Подробный протокол — в разделе «Гайды → Протокол перезапуска»."]},{"h":"Разбор 12 недель","items":["Сравни финальный тест с первым: отжимания, приседания, планка, вис, подтягивания, 1 км.","Сравни пульс покоя, сон, вес и фото.","Сдай чекап и сравни анализы.","Запиши: что сработало лучше всего, что мешало, что оставляешь в жизни навсегда."]},{"h":"Что дальше","items":["Вариант 1: пройти программу ещё раз на уровень выше.","Вариант 2: поддержка — 3 тренировки в неделю, 2 кардио, сон и питание по базе.","Вариант 3: новая цель — забег, турнир, поход в горы. Цель держит регулярность лучше всего."]},{"h":"Тренировки как образ жизни","items":["Не жди мотивации — у тебя уже есть система.","Минимум в плохие дни, полная программа в хорошие.","Тело, разум, дух: тренировка, восстановление и голова работают вместе."]}],"practice":"Заполни итоговую таблицу: тест в начале и в конце, пульс покоя, сон, вес. Выбери, какой вариант продолжения берёшь, и поставь дату старта.","quiz":[{"q":"Что важнее всего после 12 недель?","options":["Цифры теста","Навык возвращаться после срыва","Вес"],"answer":1},{"q":"Что делать после финала?","options":["Бросить тренировки","Выбрать вариант продолжения и дату старта","Ждать мотивации"],"answer":1},{"q":"Как держать регулярность после программы лучше всего?","options":["Поставить новую цель","Тренироваться только по настроению","Не планировать"],"answer":0}],"sources":[]}},"xl":[{"id":"L-FOOD","week":1,"area":"питание","title":"Питание: обязательная база","about":"Никакая добавка и никакой биохакинг не перекроют плохое питание. Вот база, без которой остальное не работает.","dur":"","sections":[{"h":"Правило тарелки","items":["Половина тарелки — овощи и зелень.","Четверть — белок: мясо, птица, рыба, яйца, творог, бобовые.","Четверть — крупы, картофель, хлеб из цельного зерна.","Плюс немного жиров: масло, орехи, авокадо, рыба.","Это работает и в столовой на вахте: собирай тарелку по этому правилу."]},{"h":"Белок","items":["1,6 г на кг веса в день — граница, после которой рост мышц на силовых почти не увеличивается (метаанализ 2018). Можно до 2,2 г на кг при сушке.","Раздели на 3–5 приёмов по 25–40 г белка.","25–40 г белка — это 150 г куриной грудки, или 200 г творога, или 4–5 яиц, или порция протеина."]},{"h":"Калории","items":["Похудение — дефицит 300–500 ккал в день: минус 0,5–1% веса в неделю без потери мышц.","Набор мышц — профицит 200–300 ккал.","Поддержание — баланс. Самый простой способ — 2 недели взвешиваться каждое утро и смотреть средний вес."]},{"h":"Клетчатка и вода","items":["Клетчатка 25–35 г в день: овощи, фрукты, крупы, бобовые, орехи. Сытость, сахар крови, кишечник.","Вода — по гайду «Вода и электролиты»."]},{"h":"Ультрапереработанная еда","items":["В исследовании NIH (2019) люди на ультрапереработанной еде съедали в среднем на 500 ккал в день больше, чем на обычной, при одинаковой доступности — и набирали вес.","Ограничь: колбасы, снеки, сладкие напитки, фастфуд, сладости. Не запрещай — ограничь до 10–20% рациона."]},{"h":"Окно питания и интервальное голодание","items":["Окно питания удобно, если помогает съедать меньше. Само по себе оно не сжигает больше: в исследовании NEJM (2022) с одинаковыми калориями окно 8 часов не дало лишнего похудения.","Ешь так, как тебе удобно держать месяцами."]},{"h":"Лайфхаки","items":["Готовь белок на 2–3 дня вперёд.","Перекус под рукой: творог, яйца, орехи, фрукты, протеин.","Ешь медленно, 15–20 минут на приём. Сытость приходит не сразу.","Сладкое — после основного приёма пищи.","Читай состав: первые 3 ингредиента — то, чего в продукте больше всего.","В гостях и на праздниках — сначала белок и овощи, потом остальное."]}],"practice":"Неделя: каждый приём пищи собирай по правилу тарелки. Посчитай белок за 3 дня — попадаешь в 1,6 г на кг?","quiz":[{"q":"Сколько белка нужно при силовых?","options":["0,5 г на кг","Около 1,6 г на кг","5 г на кг"],"answer":1},{"q":"Какую часть тарелки занимают овощи?","options":["Половину","Четверть","Не обязательно"],"answer":0},{"q":"Ускоряет ли окно питания похудение при тех же калориях?","options":["Да, сильно","Нет, важны калории","Да, вдвое"],"answer":1}],"sources":[{"title":"Белок и рост мышц: метаанализ Morton (2018)","url":"https://pubmed.ncbi.nlm.nih.gov/28698222/"},{"title":"Ультрапереработанная еда и переедание: NIH (2019)","url":"https://www.nih.gov/news-events/nih-research-matters/eating-highly-processed-foods-linked-weight-gain"},{"title":"Окно питания против подсчёта калорий (NEJM, 2022)","url":"https://medicaldialogues.in/diet-nutrition/news/calorie-restricted-diet-added-to-time-restriction-fails-to-boost-weight-loss-nejm-91790"}]},{"id":"L-BIOHACK","week":6,"area":"биохакинг","title":"Биохакинг: что работает, а что — маркетинг","about":"Биохакинг — это не таблетки и гаджеты. Это управление сном, светом, движением, едой и стрессом с помощью проверенных инструментов.","dur":"","sections":[{"h":"Уровень 1. Работает точно, бесплатно","items":["Сон 7–9 часов в одно время.","Утренний свет 10–30 минут.","Шаги 8 000+ в день.","Силовые 2–3 раза в неделю.","Белок 1,6 г на кг, клетчатка, вода.","Дыхание с длинным выдохом 5 минут в день."]},{"h":"Уровень 2. Хорошие доказательства, недорого","items":["Креатин 3–5 г в день — см. гайд «Креатин».","Кофеин 3–6 мг на кг за 30–60 минут до тренировки повышает силу и выносливость. Не позже 14:00, если тренируешься вечером — ограничь дозу.","Витамин D — по анализу.","Омега-3 — если мало жирной рыбы в рационе.","Холодный душ — бодрость и меньше больничных; не сразу после силовой."]},{"h":"Уровень 3. Данные слабые или противоречивые","items":["Ледяные ванны «для жира» — эффект на вес минимален.","Ашваганда — может снижать стресс, данные ограничены, не для всех безопасна (щитовидная железа, печень).","Голодания на 2–3 дня, детоксы и чистки — не нужны, печень и почки справляются сами.","Пищевые «антиоксиданты» в больших дозах — могут мешать адаптации к тренировкам."]},{"h":"Измеряй, а не верь","items":["Пульс покоя утром, сон, вес, тесты силы — бесплатные метрики.","Фитнес-браслет полезен для тренда, а не для точной цифры.","Анализы раз в 3–6 месяцев — блок «Чекап»."]},{"h":"Правило одного изменения","items":["Добавляй по одной практике за раз на 2–3 недели и смотри на метрики. Десять новых привычек сразу — ни одна не приживётся."]}],"practice":"Выбери одну практику из уровня 1, которую сейчас не делаешь, и держи её 14 дней.","quiz":[{"q":"Какая из практик — уровень 1?","options":["Ледяная ванна для жира","Сон 7–9 часов","Детокс-чай"],"answer":1},{"q":"Доза кофеина для тренировки?","options":["3–6 мг на кг","1 г","20 мг на кг"],"answer":0},{"q":"Сколько новых практик добавлять за раз?","options":["Одну","Все сразу","Пять"],"answer":0}],"sources":[{"title":"ISSN: кофеин и спорт","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7777221/"},{"title":"ISSN: креатин","url":"https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0173-z"},{"title":"Холодная вода после силовой снижает рост мышц: метаанализ (2024)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11235606/"},{"title":"Шаги и смертность: метаанализ 15 когорт (Lancet, 2022)","url":"https://discovery.ucl.ac.uk/id/eprint/10170017/1/1-s2.0-S2468266721003029-main.pdf"}]}],"guides":[{"id":"sleep","title":"Сон — главная добавка","about":"Мышцы растут не на тренировке, а ночью. Не спишь — работаешь вхолостую.","area":"гайд","disc":"","sections":[{"h":"Сколько","items":["Взрослому нужно 7–9 часов. Ниже 7 регулярно — уже недосып.","Режим важнее рекорда: ложись и вставай в одно время ±30 минут, в выходные тоже.","Отсыпаться в выходные не работает: два длинных утра не возвращают пять коротких ночей и сбивают ритм."]},{"h":"Что даёт недосып","items":["Растёт голод и тяга к сладкому: меньше лептина, больше грелина.","Хуже восстановление, сила и реакция.","В долгую — выше риск лишнего веса, диабета 2 типа и давления."]},{"h":"Хронотип","items":["Жаворонок: сложные задачи и тренировки — утром и днём. Главная ошибка — тянуть вечер.","Сова: сложное — на вторую половину дня. Но и сове вредно уходить в совсем поздний режим: ищи умеренно поздний, но стабильный график.","Голубь: подстраивается под любой график, правило то же — стабильность."]},{"h":"Когда тренироваться","items":["Регулярные тренировки улучшают сон в любое время дня.","Тяжёлые силовые и интервалы — не позже чем за 2–3 часа до сна.","Ходьба, растяжка, дыхание — можно и вечером.","Лучшее время тренировки — то, которое не ломает сон."]},{"h":"Вечерний ритуал","items":["За 2–3 часа: заканчиваешь интенсивную тренировку и плотный ужин.","За 1–2 часа: тёплый душ или ванна 10 минут. После него тело остывает, и засыпаешь быстрее.","За 1,5 часа: приглушённый тёплый свет вместо верхнего.","За 1 час: телефон убран, лучше в другую комнату. Будильник — отдельный.","Спальня: темно, тихо, прохладно, 16–20 °C."]},{"h":"Утро","items":["Свет в глаза в первые 30–60 минут: улица, балкон, открытые шторы.","Встаёшь по будильнику сразу, без «ещё 5 минут» с телефоном.","Кофе — через 60–90 минут после подъёма и не позже 14:00."]},{"h":"Что ломает сон","items":["Кофеин после обеда: его период полувыведения около 5 часов, у некоторых до 7–9. Кофе в 15:00 к полуночи ещё действует.","Алкоголь: засыпаешь быстрее, но сон поверхностный. Даже небольшая доза снижает восстановительное качество сна примерно на 9%, умеренная — на 24%, большая — почти на 40%.","Тяжёлая еда перед сном, яркий свет ночью, разный режим в будни и выходные."]},{"h":"Вахта и сменный график","items":["Держи «якорь»: хотя бы 4 часа сна в одно и то же время каждые сутки.","После ночной смены — тёмные очки по дороге домой, плотные шторы, беруши.","Днём перед сменой — короткий сон 20–30 минут.","Перелёт и смена часового пояса: сразу живи по местному времени, утренний свет помогает перестроиться."]},{"h":"Трекер","items":["Каждое утро 1 минута: во сколько лёг, во сколько встал, когда убрал телефон, качество сна от 1 до 5.","Раз в неделю смотри среднее. Качество ниже 3 две недели подряд — сначала чиним сон, потом добавляем нагрузку."]},{"h":"Когда к врачу","items":["Громкий храп, остановки дыхания во сне, сильная дневная сонливость, бессонница дольше 3 месяцев — это не про гигиену сна, а повод пойти к врачу."]}],"practice":"","quiz":[],"sources":[]},{"id":"water","title":"Вода и электролиты","about":"Минус 2% воды от веса тела — и сила с выносливостью уже падают. Пить надо по плану, а не когда вспомнил.","area":"гайд","disc":"","sections":[{"h":"Базовая норма","items":["30–35 мл на кг веса в сутки, в дни тренировок — около 40 мл на кг. Это вся жидкость, включая чай, суп и еду. Для простоты считай по воде.","Пример: при весе 80 кг — 2,5–3 литра в обычный день."]},{"h":"Тренировка","items":["За 2 часа до неё — 400–600 мл.","Во время — 150–250 мл каждые 15–20 минут.","После — взвесься до и после тренировки: каждый потерянный килограмм восполняешь 1,25–1,5 литра в течение 2–4 часов."]},{"h":"По дню","items":["Сразу после подъёма — 300–500 мл.","Дальше по 200–300 мл каждые 1–1,5 часа.","Основной объём — до 19:00, за 2 часа до сна только глотками.","Не больше 600–800 мл за раз: излишек почки просто выводят."]},{"h":"Электролиты","items":["Тренировка дольше 60–90 минут, жара или сильно потеешь — одной воды мало, с потом уходит натрий.","Решение: около 1–1,5 г обычной соли (это четверть чайной ложки) на литр воды или готовый электролитный порошок.","Признак нехватки натрия: пьёшь много, а жажда, вялость и головная боль не уходят."]},{"h":"Жара и вахта","items":["При работе на жаре потери пота — до 1–1,5 литра в час.","Пей по 200–250 мл каждые 20–30 минут, не дожидаясь жажды; в смену дольше 2 часов — с электролитами.","Тревожные признаки: головокружение, тошнота, прекратилось потоотделение, спутанность сознания. Это тепловой удар: в тень, охлаждать и звать помощь."]},{"h":"Как проверить","items":["Моча светло-соломенного цвета — норма. Тёмная — недопиваешь. Прозрачная весь день — перебор.","Утренняя всегда темнее, её не считай.","Важно: витамины группы B и некоторые добавки окрашивают мочу в яркий жёлтый — тогда ориентируйся на жажду и вес."]},{"h":"Частые ошибки","items":["Пить основной объём вечером и вставать ночью.","Пить «5–6 литров для очищения»: это не очищает, а вымывает натрий.","Кофе не обезвоживает, но 1:1 воду не заменяет, особенно больше 3–4 чашек в день."]}],"practice":"","quiz":[],"sources":[]},{"id":"restart","title":"Протокол перезапуска","about":"Срыв — не проблема. Проблема — когда один плохой вечер превращается в месяц. Вот что делать, чтобы этого не случилось.","area":"гайд","disc":"","sections":[{"h":"Главная мысль","items":["Заранее решённое «если — то» работает лучше силы воли. Например: «Если пропустил тренировку, на следующий день делаю минимум: один сет и два круга».","Это называется «намерения реализации». Метаанализ 94 исследований показал, что такой подход заметно повышает шанс дойти до цели."]},{"h":"Первый час","items":["Ничего не решаешь и не планируешь — мозг в стрессе принимает плохие решения.","Вода, душ, 10 минут любой активности: прогулка, зарядка.","Убери с глаз то, что спровоцировало срыв.","Напиши одну строку: когда сорвался, почему, что делаешь завтра."]},{"h":"Первые 24 часа","items":["Возвращаешься в обычный режим, а не в «идеальный».","Едешь по своему питанию без урезания калорий и голодовок.","Тренировка по плану, 30–40 минут. Мотивация придёт в процессе: действие создаёт мотивацию, а не наоборот.","Ложишься вовремя: недосып усиливает импульсивность."]},{"h":"День 2–3","items":["День 2 — тренировка на 50–70% объёма, чтобы не было сопротивления.","С дня 3 — полный режим."]},{"h":"Если снова тянет","items":["Тяга идёт волнами по 15–20 минут. Не спорь с ней — переключайся: выйди на 10 минут, выпей воды, почисти зубы, ляг раньше."]},{"h":"Чёрный список","items":["Голодать.","Наказывать себя тренировкой и «отрабатывать».","Ждать понедельника.","Строить новый идеальный план.","Часами разбирать себя и говорить «я слабый»."]},{"h":"Фраза-якорь","items":["«Один плохой вечер не ломает систему, если завтра я возвращаюсь»."]},{"h":"Когда нужна помощь","items":["Если срывы с едой или алкоголем повторяются каждую неделю и ты не можешь остановиться, это повод поговорить со специалистом, а не стараться сильнее."]}],"practice":"","quiz":[],"sources":[]},{"id":"creatine","title":"Креатин","about":"Самая изученная спортивная добавка. Даёт +1–3 повтора в подходе и больше силы за счёт быстрой энергии в мышцах.","area":"гайд","disc":"Перед приёмом любых добавок проконсультируйся с врачом, особенно при болезнях почек, диабете или если принимаешь лекарства.","sections":[{"h":"Как работает","items":["Мышца тратит АТФ за 1–2 секунды тяжёлой работы. Креатинфосфат восстанавливает АТФ ещё на 8–12 секунд.","В обычном состоянии мышцы заполнены креатином примерно на 60–80%. Добавка доводит запас до максимума.","Организм сам производит 1–2 г в день, ещё 1–2 г даёт мясо и рыба."]},{"h":"Эффект","items":["Сила и количество повторов: в среднем +5–15%.","Быстрее восстановление между подходами.","Есть данные о пользе для мозга при недосыпе и для сохранения мышц после 40 лет."]},{"h":"Как принимать","items":["Форма — креатин моногидрат, лучше с отметкой Creapure или с независимой проверкой качества.","Без загрузки: 3–5 г каждый день. Полный эффект через 3–4 недели.","С загрузкой: 20 г в день (4 приёма по 5 г) 5–7 дней, затем 3–5 г в день.","Время приёма почти не важно. Важно — каждый день, включая дни отдыха. Удобно после тренировки или с едой.","Циклы и перерывы не нужны: исследования не показывают от них пользы."]},{"h":"Вес и вода","items":["В первые 1–2 недели вес может вырасти на 1–2 кг: это вода внутри мышц, а не жир и не отёки.","Пей обычную норму воды. Креатин не обезвоживает и не вызывает судороги."]},{"h":"Безопасность","items":["У здоровых людей 3–5 г в день безопасны годами, это показано в долгих исследованиях.","Креатин повышает уровень креатинина в крови — это не значит, что страдают почки. Перед анализами предупреди врача, что принимаешь креатин.","При болезнях почек — только с разрешения врача."]},{"h":"Что может мешать","items":["Нерегулярный приём — самая частая причина «не работает».","Часть людей, примерно 20–30%, исходно получает слабый эффект: у них и так высокий запас креатина, часто у тех, кто ест много мяса.","Кофеин: данные противоречивы. Если боишься помех, принимай креатин и кофе в разное время."]},{"h":"С чем сочетается","items":["Бета-аланин 3,2–6,4 г в день, дробно по 1,6 г: помогает на подходах 1–4 минуты, может давать безвредное покалывание кожи.","Цитруллин малат 6–8 г за час до тренировки.","Омега-3, магний, витамин D, цинк — только по анализам и после консультации с врачом.","Магний в добавках — не больше 350 мг в день без назначения врача."]}],"practice":"","quiz":[],"sources":[]}],"gsrc":[{"title":"ISSN: безопасность и эффективность креатина (2017)","url":"https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0173-z"},{"title":"Метаанализ: тёплый душ или ванна перед сном (2019)","url":"https://www.news-medical.net/news/20190722/A-bath-90-minutes-before-bedtime-best-for-a-good-nights-sleep-experts-say.aspx"},{"title":"Firstbeat: алкоголь и качество сна","url":"https://www.firstbeat.com/en/news/new-research-reveals-vital-link-between-alcohol-intake-and-sleep-quality-using-real-world-data/"},{"title":"Гидратация спортсмена: рекомендации ACSM","url":"https://www.todaysdietitian.com/nutrition-for-athletic-performance-a-focus-on-hydration/"},{"title":"Недосып, лептин и грелин","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4434546"}],"warmup":"Суставная разминка сверху вниз, затем 2–3 минуты лёгкого бега на месте или скакалки.","morning":"Короткая зарядка каждое утро, даже в день отдыха."},"year":[{"n":1,"id":"Январь","ph":"База","q":1,"k":1,"sub":"Техника и ритм","goal":"Поставить технику и привычку: 3 тренировки в неделю без пропусков. Работа спокойная, без отказа.","tech":"Правило месяца: в каждом подходе остаётся 2–3 повтора в запасе.","rest":90,"food":"Питание: поддержание. Главное — белок 1,6–2 г на кг и режим.","rec":"Вт — спокойное кардио 30–40 мин (разговорный темп). Чт — МФР, растяжка, осанка 30 мин. Сб — прогулка или любое кардио в радость. Вс — выходной.","fin":"Финиш месяца (последняя пятница): повтори тест первой недели и сравни цифры.","lv":{"start":[{"w":1,"dn":"пн","t":"Грудь и спина","r":[2,3],"rest":90,"s":[[["отжимания с положительным углом","10–15"],["тяга лежа","10–15"]],[["прожимка","10–15"],["лодочка","10–15"]],[["выпады с поворотом","по 8–10"],["планка на руках","20–30 сек"]],[["подъем рук перед собой с резиной","15–20"],["скала","10–15"]],[["обратные отжимания","10–15"],["сгибания рук с резиной","15–20"],["пресс стул","12–18"],["планка на локтях","20–30 сек"]]]},{"w":1,"dn":"ср","t":"Спина и плечи","r":[2,3],"rest":90,"s":[[["тяга на себя с резиной","15–20"],["жим вверх с резиной","15–20"]],[["молитва","10–15"],["отжимания с положительным углом","10–15"]],[["ягодичный мост","10–15"],["бег на месте","20 сек"]],[["мах на заднюю дельту с резиной","15–20"],["пуловер с резиной","15–20"]],[["сгибания рук с резиной  за 1 минуту","планка на локтях — время"],"home":["отжимания классика — максимум за подход","приседания за 1 минуту","планка на локтях — время"],"street":["подтягивания — максимум за подход","отжимания от брусьев — максимум за подход","вис на турнике — время"],"gym":["жим штанги лёжа — вес на 8 повторов","подтягивания — максимум за подход","приседания со штангой — вес на 8 повторов"]},"tips":[[["Правило двух дней","Пропустить одну тренировку — нормально. Две подряд — уже начало новой привычки, только не той. Если день сорвался, сделай минимум: один сет, два круга."],["Что значит «запас 2–3 повтора»","Заканчивай подход, когда чувствуешь, что смог бы сделать ещё 2–3 чистых повтора. В первый месяц это даёт технику и суставам время привыкнуть."],["Разминка за 5 минут","Суставы сверху вниз, минута бега на месте, один лёгкий круг первого сета. Тёплая мышца работает сильнее, и риск травмы ниже."],["Записывай цифры","Повторы в главном сете записывай после каждой тренировки. Через месяц это твоё доказательство прогресса — память здесь обманывает."]],[["Белок — стройматериал","Ориентир — 1,6–2 г белка на кг веса в день, разделённые на 3–4 приёма. Без него дополнительный круг не превращается в результат."],["Боль в мышцах — не показатель","Крепатура говорит только о том, что нагрузка была непривычной. Хорошая тренировка может пройти вообще без неё. Смотри на цифры, а не на боль."],["Шаги работают каждый день","7–10 тысяч шагов в день ускоряют восстановление и держат вес лучше, чем редкое тяжёлое кардио. Начни с прогулки после ужина."],["Вода до и после","Стакан воды за 20–30 минут до тренировки и стакан после. Простой ориентир на день — светло-жёлтая моча."]],[["Выдох на усилие","Поднимаешься, жмёшь, тянешь — выдох. Опускаешься — вдох. Не задерживай дыхание: при коротком отдыхе это быстро сбивает пульс."],["Отдыхай по таймеру","Без таймера 60 секунд легко превращаются в три минуты. В этом месяце именно короткий отдых делает работу — ставь таймер в плеере."],["Выносливость строится ночью","7–9 часов сна в одно и то же время. При недосыпе пульс на той же работе выше, а восстановление медленнее."],["Разговорный темп","На кардио во вторник держи темп, при котором можешь говорить фразами. Это и есть база выносливости, быстрее не значит лучше."]],[["Зачем опускаться медленно","На опускании мышца выдерживает больше, чем на подъёме. Три секунды вниз нагружают её сильнее без лишнего веса и учат контролю."],["Сила — это навык","В первые недели сила растёт за счёт нервной системы: она учится включать больше волокон. Поэтому повторов меньше, а каждый — чистый."],["Отдых 2–3 минуты — это работа","Силовой подход сжигает быстрый запас энергии, и он восстанавливается 2–3 минуты. Сократишь отдых — сделаешь меньше повторов и получишь меньше силы."],["Сначала лопатки","В тягах и подтягиваниях первым движением опусти и сведи лопатки, потом сгибай руки. Так работает спина, а не только бицепс."]],[["Пауза убирает инерцию","Две секунды в нижней точке гасят отскок. Мышца стартует с нуля — тяжело, зато сила растёт именно в слабом месте."],["Креатин: если решишь добавить","Самая изученная добавка для силы: 3–5 г моногидрата в день, без «загрузок» и циклов. При болезнях почек и на лекарствах — только после врача."],["Углеводы до тренировки","За 1,5–2 часа до силовой съешь нормальный приём с углеводами: каша, рис, хлеб. На пустом баке тяжёлые подходы не идут."],["Недосып забирает силу","После короткой ночи падает и сила, и желание тренироваться. В тяжёлый месяц сон — часть программы: ложись на 30 минут раньше."]],[["Как работает лесенка","1-2-3-4-5-4-3-2-1 — это 25 повторов, и почти все без усталости. Много качественной работы без отказа — так и растёт сила."],["Отказ для силы не нужен","Останавливайся за 1–2 повтора до предела. Отказные подходы дольше восстанавливаются и не дают прибавки в силе."],["Перед рекордом — отдых","За два дня до финиша месяца не добавляй нагрузку. Свежая нервная система — половина рекорда."],["Рекорд считается честно","Те же условия, что в начале: время дня, разминка, техника. Иначе сравниваешь не силу, а обстоятельства."]],[["Плюс 10–20% к норме","Мышцам нужен избыток энергии. Хороший темп набора — 0,25–0,5% веса тела в неделю. Быстрее — растёт в основном жир."],["Сколько работы нужно мышце","Ориентир для роста — 10–20 подходов на группу мышц в неделю. В программе это уже заложено: не добавляй сверху, лучше доделывай своё чисто."],["Близко к отказу","Рост запускают последние трудные повторы. Заканчивай подход, когда в запасе остался 1–2 повтора, а не 5."],["Белок в каждом приёме","20–40 г белка 3–4 раза в день работают лучше, чем вся норма за ужин. Проще всего: добавь белковый продукт к каждому приёму."]],[["Что такое добивка","Сделал подход, отдохнул 15–20 секунд и добавил ещё 3–5 повторов. Только в последнем круге главного сета и только с чистой техникой."],["Вес стоит две недели","Если вес не растёт две недели подряд, добавь 150–200 ккал в день — это тарелка каши или горсть орехов. Тренировки менять не надо."],["Чувствуй мышцу","Сбавь темп и думай о мышце, которая работает. В упражнениях на одну мышцу это реально повышает её включение."],["Рост идёт во сне","Тренировка даёт сигнал, а строится мышца между тренировками. Меньше 7 часов сна — и часть работы уходит впустую."]],[["Секунда в пике","Задержка в верхней точке убирает рывок и держит мышцу под нагрузкой дольше. Возьми вес или вариант чуть легче — так и задумано."],["Боль в суставе — стоп","Жжение в мышце — работа. Острая или тянущая боль в суставе — сигнал: останови упражнение и замени его на похожее без боли."],["Замеры честнее весов","Раз в две недели: талия, грудь, бицепс, бедро, утром натощак. На наборе вес растёт всегда, а сантиметры показывают, куда он идёт."],["Разгрузка закрепляет","На лёгкой неделе тело достраивает то, что ты наработал за три тяжёлые. Не добавляй круги — это не слабость, а часть плана."]],[["Дефицит 15–20%","Хороший темп сушки — 0,5–1% веса в неделю. Быстрее — вместе с жиром уходят мышцы и силы на тренировки."],["Белок бережёт мышцы","На дефиците держи около 2 г белка на кг. Вместе с силовыми это сигнал телу: мышцы нужны, трать жир."],["Шаги — главный расход","8–10 тысяч шагов в день сжигают больше, чем три кардио в неделю, и не мешают восстановлению. Не закрыл норму — пройдись вечером."],["Вес скачет — это вода","За день вес гуляет на 1–2 кг из-за соли, воды и еды. Взвешивайся утром и сравнивай среднее за неделю, а не отдельные дни."]],[["Зачем работа по таймеру","30 секунд работы и 15 отдыха держат пульс высоким и не дают считать повторы вполсилы. Темп ровный, техника важнее скорости."],["Как справиться с голодом","Объём без калорий: овощи, суп, вода. Белок в каждом приёме. Голод вечером чаще всего значит, что днём было мало еды."],["Сон управляет аппетитом","После короткой ночи есть хочется сильнее, особенно сладкого. На сушке ложись вовремя — это проще, чем бороться с тягой."],["Если вес встал","Две недели без изменений в среднем весе и талии — убери 100–150 ккал или добавь 2 тысячи шагов. Что-то одно, не всё сразу."]],[["Силу на сушке держим","Первый сет делай так же тяжело, как раньше. Пока сила на месте, мышцы тоже на месте."],["Один ужин ничего не ломает","Праздник или застолье — не срыв. Сушку ломает не один вечер, а неделя «раз уж начал». На следующий день — обычный режим."],["Как выйти из сушки","Не возвращай всю еду сразу. Добавляй по 100–150 ккал в неделю, пока вес не остановится, — так результат остаётся."],["Подведи итог","Сравни тест, замеры и фото со своим стартом. Запиши три вещи, которые сработали лучше всего, — возьмёшь их в следующий этап."]]]};

let tab='today',sub={train:'mar',nutri:'calc'},stack=[];

const TG=window.Telegram&&window.Telegram.WebApp;

function render(scroll){
  const top=stack[stack.length-1];

  app.innerHTML=html;

const PRICE={month:'1 000 ₽',p90:'10 000 ₽'};
const GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const PHC={1:'var(--vi2)',2:'#fff',3:'var(--tq)',4:'#E7A8FF'};
const WKN=['вход','нагрузка','пик','разгрузка и финиш'];
const DAY=864e5,MLEN=30;
const pDays=()=>S.t0?Math.max(0,Math.floor((Date.now()-new Date(S.t0+'T00:00:00').getTime())/DAY)):0;
const pK=()=>Math.floor(pDays()/MLEN);
const pCur=()=>Math.max(0,pK()-(S.bk||0));
const MN=()=>S.pm||((S.base||1)-1+pCur())%12+1;
const pPos=n=>((n-1)-((S.base||1)-1)+12)%12;
const pLeft=()=>MLEN-pDays()%MLEN+(pK()<(S.bk||0)?MLEN:0);
const canChg=()=>S.demo||S.chg!==pK();
const BASIC=3;
const stepPaid=st=>hasP90()||D.ladder.indexOf(st)<BASIC;
const tipWeek=()=>S.pm?4:Math.min(4,Math.floor((pDays()%MLEN)/7)+1);
const mName=mo=>mo.ph+' · месяц '+mo.k+' из 3';
const GOALS=[[1,'База','Новичок или был перерыв. Хочу втянуться, поставить технику и привычку.'],[2,'Сила','Тренируюсь регулярно. Хочу стать сильнее: больше подтягиваний, отжиманий, веса.'],[3,'Рост мышц','Хочу набрать мышечную массу и объём.'],[4,'Сушка','Хочу убрать жир и сохранить мышцы.']];
function pickGoal(q){
  const first=!S.goal;if(!first&&!canChg())return;
  if(first){S.t0=todayISO();S.bk=0;S.chg=-1}else{S.bk=MLEN-pDays()%MLEN<15?pK()+1:pK();S.chg=pK()}
  S.goal=q;S.base=(q-1)*3+1;S.pm=0;save();stack=[];tab='today';render(true);toast('Этап «'+GOALS[q-1][1]+'» — месяц 1')}
function goalScr(first){
  const ok=first||canChg(),cq=S.goal?M(MN()).q:0,left=MLEN-pDays()%MLEN;
  return `<div class="scr${first?'':' full'}">${first?'<div class="h1" style="font-size:20px;letter-spacing:1.5px">THREGONS</div>':topbar('Приоритет')}
  <div><div class="h1">Что сейчас в приоритете?</div><div class="muted" style="margin-top:8px;line-height:1.5">С этого этапа начнётся твой месяц тренировок. Каждый этап — 3 месяца, дальше они идут по кругу.</div></div>
  ${ok?'':`<div class="card" style="border-color:var(--vi2)"><div class="row"><span class="lock">${I.lock}</span><div class="h2">Смена уже использована</div></div><div class="sm muted" style="line-height:1.5">Приоритет можно менять один раз за оплаченный месяц. Снова — через ${left} ${plural(left,'день','дня','дней')}.</div></div>`}
  <div class="list">${GOALS.map(([q,n,d])=>`<button class="item" style="${cq===q?'border-color:var(--tq);':''}${ok&&cq!==q?'':first?'':'opacity:.6'}" ${ok&&cq!==q?`onclick="${first?`pickGoal(${q})`:`go('goalok',{q:${q}})`}"`:'disabled'}><span class="num" style="background:${PHC[q]};color:#120E24">${q}</span><div class="grow"><div class="t">${n}${cq===q?' · сейчас':''}</div><div class="sm muted" style="line-height:1.45">${d}</div></div>${ok&&cq!==q?I.chev:''}</button>`).join('')}</div>
  <div class="sm muted" style="line-height:1.5">${first?'Не уверен — начни с базы. Потом приоритет можно сменить один раз за оплаченный месяц.':ok?'Сменить приоритет можно один раз за оплаченный месяц.':''}</div></div>`;
}
function goalOk(q){
  const left=MLEN-pDays()%MLEN,g=GOALS[q-1];
  return `<div class="scr full">${topbar('Смена приоритета')}
  <div><div class="cap" style="color:${PHC[q]}">Новый этап</div><div class="h1" style="margin-top:8px">${g[1]}</div><div class="muted" style="margin-top:8px;line-height:1.5">${g[2]}</div></div>
  <div class="card"><div class="sm" style="line-height:1.55">Начнёшь с месяца 1 этапа «${g[1]}». Сделанные тренировки сохранятся.</div>
  <div class="sm" style="line-height:1.55">${left<15?`До конца оплаченного месяца ${left} ${plural(left,'день','дня','дней')}, поэтому месяц 1 продолжится и в следующем оплаченном месяце.`:`До конца оплаченного месяца ${left} ${plural(left,'день','дня','дней')} — потом откроется месяц 2.`}</div>
  <div class="sm muted" style="line-height:1.55">Сменить приоритет можно один раз за оплаченный месяц. Следующая смена — в новом месяце.</div></div>
  <button class="btn" onclick="pickGoal(${q})">Перейти на «${g[1]}»</button><button class="btn ghost" onclick="back()">Оставить как есть</button></div>`;
}

const M=n=>D.year[n-1];
const hasP90=()=>S.tariff==='p90'||S.demo;
function wlist(n,lv){return M(n).lv[lv]||[]}
const dkey=(n,lv,i)=>'y'+n+'|'+lv+'|'+i;
function nextIdx(n,lv){const l=wlist(n,lv);for(let i=0;i<l.length;i++)if(!S.done[dkey(n,lv,i)])return i;return 0}
function mStat(n){const l=wlist(n,S.lvl);let dn=0;l.forEach((w,i)=>{if(S.done[dkey(n,S.lvl,i)])dn++});return {dn,all:l.length}}
function exCount(w){return w.s.reduce((a,s)=>a+s.length,0)}
function fmtD(s){const [y,m,d]=s.split('-');return d+'.'+m}
function wTitle(w){return w.t}
const wLab=w=>'Неделя '+w.w+' · '+w.dn;
const rTxt=w=>w.r[0]===w.r[1]?w.r[0]+' '+plural(w.r[0],'круг','круга','кругов'):w.r[0]+'–'+w.r[1]+' круга';
const restTxt=s=>s>=120?(s/60+' мин').replace('.',','):s+' сек';
function findCat(name){
  const n=name.toLowerCase().replace(/[«»*]/g,'').trim();
  let best=null;for(const c of D.cat){const cn=c.n.toLowerCase();if(n===cn)return c;if(n.startsWith(cn)&&(!best||cn.length>best.n.length))best=c}
  return best;
}

// ---------- знания ----------
function stepOpen(st){return S.demo||(stepPaid(st)&&total()>=st.n)}
function nextStep(){return D.ladder.find(st=>stepPaid(st)&&!stepOpen(st))}
function tipsCard(){
  if(!S.goal)return '';const w=tipWeek(),T=D.tips[MN()-1];
  return `<div class="card"><div class="row sb"><div class="cap">Польза недели</div><div class="pill">неделя ${w} из 4</div></div>${T.map((t,i)=>i<w?`<details ${i===w-1?'open':''}><summary style="font-weight:700;cursor:pointer;padding:6px 0">${esc(t[0])}</summary><div class="sm muted" style="line-height:1.55;padding-bottom:6px">${esc(t[1])}</div></details>`:`<div class="row sm muted" style="padding:6px 0"><span class="lock">${I.lock}</span>Откроется на неделе ${i+1}</div>`).join('')}</div>`;
}
function tipNow(){
  if(!S.goal)return '';const w=tipWeek(),t=D.tips[MN()-1][w-1];
  return `<div class="card"><div class="cap">Польза недели</div><div class="h2">${esc(t[0])}</div><div class="sm muted" style="line-height:1.55">${esc(t[1])}</div></div>`;
}
function lessonTitle(id){return id==='nutrition'?'Питание: норма, планы, рецепты':D.lessons[id].t}

// ---------- экраны ----------
const SCR={};
SCR.goal=()=>goalScr(false);
SCR.goalok=({q})=>goalOk(q);
SCR.today=()=>{
  const now=new Date(),doy=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5);
  const [it,ia]=D.intent[doy%D.intent.length];
  const days=['пн','вт','ср','чт','пт','сб','вс'];
  const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  let week=0;const dots=days.map((dn,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const k=iso(d),on=S.log.includes(k);if(on)week++;return `<div class="dot ${on?'on':''} ${k===todayISO()?'now':''}" title="${dn}">${dn[0]}</div>`}).join('');
  const ns=nextStep();
  const dateStr=now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  if(!S.goal)return goalScr(true);
  if(S.prog==='p90'&&hasP90())return todayP90(it,ia,dots,week,dateStr,ns);
  const mid=MN(),mo=M(mid);let lv=S.lvl;
  const l=wlist(mid,lv),i=nextIdx(mid,lv),w=l[i];
  return `<div class="scr">
  <div class="row sb"><div><div class="h1" style="font-size:20px;letter-spacing:1.5px">THREGONS</div><div class="sm muted" style="margin-top:4px">${esc(dateStr[0].toUpperCase()+dateStr.slice(1))}</div></div>
  <button class="back" onclick="setTab('me')" aria-label="Профиль">${I.user}</button></div>
  <div class="card">
    <div class="cap">Намерение дня</div>
    <div style="font-size:17px;line-height:1.45;font-weight:700">${esc(it)}</div>
    <div class="sm muted">${esc(ia)}</div>
    <div style="height:1px;background:var(--ln)"></div>
    <div class="row sb"><div style="font-weight:700">Ритм недели: <span class="done">${week}</span></div><div class="sm muted">всего ${total()}</div></div><div class="dots" style="justify-content:space-between">${dots}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px"><div class="sm muted" style="font-weight:700">Мой уровень</div>${levelSeg(lv,'pickLvl')}</div>
  ${w?`<div class="today">
    <div class="row sb"><div class="cap" style="color:#fff">${esc(mName(mo))}</div><div class="chip">${LVN[lv]}</div></div>
    <div class="h1">${wTitle(w)}</div>
    <div class="sm" style="color:#EDE6FF">${wLab(w)} · тренировка ${i+1} из ${l.length} · ${w.s.length} сетов, ${rTxt(w)}</div>
    <div class="list" style="gap:6px">${w.s.slice(0,2).map((s,k)=>`<div class="row sm"><span class="num">${k+1}</span><span>${s.map(e=>esc(e[0])).join(' · ')}</span></div>`).join('')}
    ${w.s.length>2?`<div class="row sm" style="color:#EDE6FF"><span class="num" style="color:#fff">+${w.s.length-2}</span>ещё ${w.s.length-2===1?'сет':'сета'}</div>`:''}</div>
    <button class="btn" onclick="go('player',{kind:'mar',mid:'${mid}',lv:'${lv}',i:${i}})">${I.play}Начать тренировку</button>
    <button class="btn ghost sm" style="background:var(--vid);border:0" onclick="go('workout',{mid:'${mid}',lv:'${lv}',i:${i}})">Посмотреть упражнения</button>
  </div>`:`<div class="card">В этом марафоне нет уровня «${LVN[S.lvl]}». Выбери другой уровень или марафон.</div>`}
  ${tipNow()}
  <div class="grid2">
    <button class="tile" onclick="setTab('train')">${I.cal}<div class="h2" style="font-size:16px">Марафоны</div><div class="sm muted">${esc(mo.ph)}: ${esc(mo.sub.toLowerCase())}</div></button>
    <button class="tile" onclick="sub.train='p90';setTab('train')">${I.up}<div class="h2" style="font-size:16px">Путь 90 дней</div><div class="grid2" style="grid-template-columns:repeat(3,1fr);gap:4px"><div class="bar"><i style="background:var(--vi2)"></i></div><div class="bar"><i style="background:var(--vi)"></i></div><div class="bar"><i></i></div></div><div class="xs muted">Фундамент → Сила → Пик</div></button>
  </div>
  ${ns?`<button class="item" onclick="setTab('know')"><span class="lock">${I.lock}</span><div class="grow"><div class="t">Следующий шаг знаний: ${esc(ns.t)}</div><div class="sm muted">Откроется через ${ns.n-total()} ${plural(ns.n-total(),'тренировку','тренировки','тренировок')}</div></div>${I.chev}</button>`:''}
  </div>`;
};
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
function levelSeg(cur,fn,only){const list=only||LV;return `<div class="seg">${list.map(([k,n])=>`<button class="${cur===k?'on':''}" onclick="${fn}('${k}')">${n}</button>`).join('')}</div>`}
function pickLvl(k){S.lvl=k;save();render()}

SCR.train=()=>{
  const s=sub.train;
  let body='';
  if(s==='mar'){
    body=marHome();
  }else if(s==='p90'){
    body=hasP90()?p90Home():p90Lock();
  }else{
    body=`<input class="f" id="q" placeholder="Поиск упражнения или мышцы" oninput="exFilter(this.value)" aria-label="Поиск упражнения"><div class="sm muted">${D.cat.length} упражнений</div><div class="list" id="exl">${exRows('')}</div>`;
  }
  return `<div class="scr"><div class="h1">Тренировки</div>
  <div class="seg"><button class="${s==='mar'?'on':''}" onclick="sub.train='mar';render()">Марафоны</button><button class="${s==='p90'?'on':''}" onclick="sub.train='p90';render()">90 дней</button><button class="${s==='ex'?'on':''}" onclick="sub.train='ex';render()">Упражнения</button></div>
  ${body}</div>`+tabs();
};
function exRows(q){q=q.toLowerCase().trim();const r=D.cat.filter(c=>!q||c.n.toLowerCase().includes(q)||c.m.toLowerCase().includes(q)).slice(0,60);
  return r.map(c=>`<button class="item" onclick="go('exercise',{n:${esc(JSON.stringify(c.n))}})"><div class="grow"><div class="t">${esc(c.n)}</div><div class="sm muted">${esc(c.m||'—')}</div></div>${I.chev}</button>`).join('')||'<div class="muted">Ничего не нашлось</div>'}
function exFilter(v){document.getElementById('exl').innerHTML=exRows(v)}

function marHome(){
  if(!S.goal)return goalScr(true).replace('<div class="scr">','<div style="display:flex;flex-direction:column;gap:18px">').replace(/<div class="h1" style="font-size:20px[^>]*>THREGONS<\/div>/,'');
  const n=MN(),mo=M(n),st=mStat(n),kp=pPos(n),left=pLeft();
  const qs=[0,1,2,3].map(x=>(S.goal-1+x)%4+1).map(q=>{const ms=D.year.filter(m=>m.q===q);
    return `<div class="card"><div class="row sb"><div class="cap" style="color:${PHC[q]}">${esc(ms[0].ph)}</div><div class="xs muted">3 месяца</div></div>
    <div class="list">${ms.map(m=>{const cur=m.n===n,open=cur||hasP90(),pp=pPos(m.n),d=(pp-kp+12)%12;
      return `<button class="item" style="background:var(--sf2);${cur?'border-color:var(--tq)':''}" onclick="go('${open?'month':'mprev'}',{mid:${m.n}})"><span class="num" style="${cur?'background:var(--tq);color:#120E24':''}">${pp+1}</span><div class="grow"><div class="t">${esc(m.sub)}</div><div class="sm muted">${cur?'идёт сейчас · ещё '+left+' '+plural(left,'день','дня','дней'):(hasP90()?'открыт · по плану ':'')+'через '+d+' '+plural(d,'месяц','месяца','месяцев')}</div></div>${open?I.chev:`<span class="lock">${I.lock}</span>`}</button>`}).join('')}</div></div>`}).join('');
  return `<div class="today"><div class="row sb"><div class="cap" style="color:#fff">Марафон месяца</div><div class="chip">месяц ${mo.k} из 3</div></div>
  <div class="h1">${esc(mo.ph)}</div><div style="font-weight:700">${esc(mo.sub)}</div>
  <div class="sm" style="color:#EDE6FF;line-height:1.5">${esc(mo.goal)}</div>
  <div class="row sb sm"><span>Сделано ${st.dn} из ${st.all} · ${LVN[S.lvl]}</span><span>${Math.round(st.dn/st.all*100)}%</span></div><div class="bar" style="background:var(--vid)"><i style="width:${Math.round(st.dn/st.all*100)}%"></i></div>
  <button class="btn" onclick="go('month',{mid:${n}})">Открыть тренировки</button>
  <button class="btn ghost sm" style="background:var(--vid);border:0" onclick="go('goal')">Сменить приоритет</button></div>
  <div><div class="h2">Твой путь</div><div class="sm muted" style="margin-top:6px;line-height:1.5">Твой путь идёт от этапа «${esc(GOALS[S.goal-1][1])}». Каждый месяц — новый марафон, открыт тот, что идёт сейчас. Этапы идут по кругу: база → сила → рост мышц → сушка.</div></div>${qs}`;
}
function p90Lock(){
  return `<div class="card" style="border-color:var(--vi2)"><div class="cap" style="color:var(--vi2)">Программа · ${PRICE.p90}</div><div class="h1" style="font-size:20px">Путь 90 дней</div>
  <div class="sm muted" style="line-height:1.5">12 недель по плану: Фундамент → Сила → Пик. Лекции каждую неделю, тесты, чекап и все бонусы — знания, питание, добавки.</div>
  <button class="btn" onclick="go('tariff')">Смотреть тарифы</button></div>`;
}
SCR.mprev=({mid})=>{const mo=M(mid);
  const d=(pPos(mo.n)-pPos(MN())+12)%12;
  return `<div class="scr full">${topbar(mo.ph+' · '+mo.k+'/3')}
  <div><div class="cap" style="color:${PHC[mo.q]}">${esc(mo.ph)} · месяц ${mo.k} из 3</div><div class="h1" style="margin-top:8px">${esc(mo.sub)}</div><div class="muted" style="margin-top:8px;line-height:1.5">${esc(mo.goal)}</div></div>
  <div class="card"><div class="row"><span class="lock">${I.lock}</span><div class="h2">Откроется через ${d} ${plural(d,'месяц','месяца','месяцев')}</div></div><div class="sm muted" style="line-height:1.5">Месяцы открываются по порядку твоего пути: 12 тренировок на каждом из четырёх уровней, 4 недели. Сейчас у тебя: ${esc(mName(M(MN())).toLowerCase())}. Хочешь этот этап сейчас — смени приоритет.</div></div>
  <div class="card"><div class="cap">Что будет в этом месяце</div><div class="sm">${esc(mo.tech)}</div><div class="sm muted">${esc(mo.food)}</div></div>
  <button class="btn ghost" onclick="go('goal')">Сменить приоритет</button></div>`;
};
SCR.month=({mid})=>{
  const mo=M(mid),lv=S.lvl,l=wlist(mid,lv);
  const weeks=[1,2,3,4].map(wn=>`<div class="sm muted" style="font-weight:700;margin-top:4px">Неделя ${wn} · ${WKN[wn-1]}</div>
  <div class="list">${l.map((w,i)=>{if(w.w!==wn)return '';const dn=S.done[dkey(mid,lv,i)];return `<button class="item" onclick="go('workout',{mid:${mid},lv:'${lv}',i:${i}})"><span class="num" style="${dn?'background:var(--tq);color:#120E24':''}">${dn?I.check:i+1}</span><div class="grow"><div class="t">${w.dn[0].toUpperCase()+w.dn.slice(1)} · ${esc(w.t)}</div><div class="sm muted">${w.s.length} сетов · ${rTxt(w)} · отдых ${restTxt(w.rest)}</div></div>${I.chev}</button>`}).join('')}</div>`).join('');
  return `<div class="scr">${topbar(mo.ph+' · месяц '+mo.k)}
  <div><div class="cap" style="color:${PHC[mo.q]}">${esc(mo.ph)} · месяц ${mo.k} из 3</div><div class="h1" style="margin-top:8px">${esc(mo.sub)}</div><div class="muted" style="margin-top:8px;line-height:1.5">${esc(mo.goal)}</div></div>
  <div class="card"><div class="cap">Как работаем</div><div style="line-height:1.5">${esc(mo.tech)}</div><div class="sm muted" style="line-height:1.5">${esc(mo.food)}</div></div>
  <details class="card"><summary style="font-weight:700;cursor:pointer">Восстановление, тест и финиш месяца</summary>
  <div class="sm muted" style="line-height:1.5">${esc(mo.rec)}</div>
  <div class="sm" style="line-height:1.5"><b>Тест (неделя 1 и последняя пятница):</b> ${D.test[lv].map(esc).join('; ')}.</div>
  <div class="sm" style="line-height:1.5">${esc(mo.fin)}</div></details>
  ${levelSeg(lv,'pickLvlM')}${weeks}</div>`;
};
function pickLvlM(k){S.lvl=k;save();render()}

SCR.workout=({mid,lv,i})=>{
  const w=wlist(mid,lv)[i];
  const mo=M(mid);
  return `<div class="scr full">${topbar(wLab(w)+' · '+LVN[lv])}
  <div><div class="h1">${wTitle(w)}</div><div class="sm muted" style="margin-top:6px">${esc(mo.ph)} · месяц ${mo.k} · ${w.s.length} сетов · ${exCount(w)} упражнений</div></div>
  <div class="card"><div class="row sb"><div class="cap">${rTxt(w)} на сет</div><div class="pill">отдых ${restTxt(w.rest)}</div></div><div class="sm" style="line-height:1.5">${esc(mo.tech)}</div>${w.n?`<div class="sm" style="line-height:1.5;color:var(--tq)">${esc(w.n)}</div>`:''}<div class="sm muted" style="line-height:1.5">Упражнения сета — подряд, это 1 круг. Прошёл все круги — следующий сет. В конце — заминка.${lv==='start'?' Прыжки и бег можно заменить шагом на месте.':''}</div></div>
  ${w.s.map((s,k)=>`<div class="card"><div class="cap">Сет ${k+1}</div>${s.map(e=>`<button class="ex" style="background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:#fff" onclick="go('exercise',{n:${esc(JSON.stringify(e[0]))}})"><div style="flex:1">${esc(e[0])}</div><div class="reps">${esc(e[1])}</div></button>`).join('')}</div>`).join('')}
  <button class="btn" onclick="go('player',{kind:'mar',mid:'${mid}',lv:'${lv}',i:${i}})">${I.play}Начать тренировку</button></div>`;
};

SCR.exercise=({n})=>{
  const c=findCat(n);
  return `<div class="scr full">${topbar('Упражнение')}<div class="h1" style="font-size:22px">${esc(n)}</div>
  <div class="vid">${I.play}<div>Видео из GIF TRAIN появится здесь</div></div>
  ${c?`<div class="card"><div class="row sb"><span class="muted sm">Мышцы</span><span style="text-align:right">${esc(c.m||'—')}</span></div><div class="row sb"><span class="muted sm">Встречается в марафонах</span><span>${c.c} раз</span></div></div>`:''}</div>`;
};

// ---------- плеер ----------
let P=null,TIMER=null;
function rng(r){const m=String(r||'').match(/\d+/g);if(!m)return [3,4];const a=+m[0],b=+(m[1]||m[0]);return [a,b]}
function restSec(t){t=String(t||'');const m=t.match(/(\d+(?:,\d+)?)\s*(сек|мин)/);if(!m)return 90;const v=parseFloat(m[1].replace(',','.'));return Math.round(m[2]==='мин'?v*60:v)}
function getW(p){
  if(p.kind==='p90'){
    const wk=D.p90.weeks[p.w],dy=wk.days[p.d],L=dy.lv[p.lv];
    let [a,b]=rng(L.rounds);if(/1 круг/.test(dy.fmt)){a=1;b=1}
    const r=Math.min(restSec(L.rest),120);
    return {key:'p90|'+p.w+'|'+p.d,title:dy.t,sets:L.sets.map((x,k)=>({label:(x.b?x.b.replace(': турник и брусья','')+' · ':'')+'сет '+(k+1),ex:x.ex})),rmin:a,rmax:b,rest:r};
  }
  const w=wlist(p.mid,p.lv)[p.i];
  return {key:dkey(p.mid,p.lv,p.i),title:wTitle(w),sets:w.s.map((x,k)=>({label:'Сет '+(k+1),ex:x})),rmin:w.r[0],rmax:w.r[1],rest:w.rest};
}
SCR.player=(p)=>{
  const W=getW(p),n=W.sets.length;
  if(!P||P.key!==W.key)P={key:W.key,set:0,round:1,rest:0,between:false};
  const s=W.sets[P.set],last=P.set===n-1;
  const prog=Math.round((P.set+(P.round-1)/W.rmax)/n*100);
  if(P.rest>0){
    return `<div class="scr full" style="min-height:100vh;justify-content:center">
    <div class="cap" style="text-align:center">${P.between?'Отдых перед: '+esc(W.sets[P.set].label):'Отдых · дальше круг '+P.round+' из '+W.rmax}</div>
    <div class="timer" id="tm">${fmtT(P.rest)}</div>
    <div class="sm muted" style="text-align:center;line-height:1.5">Представь мышцу, которую только что работал, и как она становится сильнее.<br>— визуализация процесса, Зеланд</div>
    <div class="row"><button class="btn ghost" onclick="P.rest+=15;render()">+15 сек</button><button class="btn" onclick="P.rest=0;render()">Дальше</button></div></div>`;
  }
  const dots=[];for(let r=1;r<=W.rmax;r++)dots.push(`<div class="dot ${r<P.round?'on':''} ${r===P.round?'now':''}"></div>`);
  const ex0=s.ex[0];
  return `<div class="scr full">
  <div class="top"><button class="back" onclick="if(confirmExit())back()" aria-label="Выйти">${I.back}</button><div style="flex:1"><div class="h2">${esc(s.label[0].toUpperCase()+s.label.slice(1))} · ${P.set+1}/${n}</div><div class="bar" style="margin-top:8px"><i style="width:${prog}%"></i></div></div></div>
  <div class="vid">${I.play}<div>${esc(ex0[0])}<br><span class="xs">${ex0[2]===0?'видео нужно доснять':'видео GIF TRAIN появится здесь'}</span></div></div>
  <div class="card"><div class="row sb"><div class="cap">Круг ${P.round} из ${W.rmax}</div><div class="dots">${dots.join('')}</div></div>
  ${s.ex.map(e=>`<div class="ex"><div style="flex:1;font-weight:600">${esc(e[0])}</div><div class="reps">${esc(e[1])}</div></div>`).join('')}</div>
  <button class="btn" onclick="roundDone()">${I.check}Круг сделан</button>
  ${W.rmax>W.rmin&&P.round>=W.rmin?`<button class="btn ghost" onclick="nextSet()">${last?'Завершить тренировку':'Хватит — следующий сет'}</button>`:''}
  <div class="xs muted" style="text-align:center">Сет — упражнения подряд без отдыха. Прошёл связку — один круг. Боль в суставе — остановись и замени упражнение.</div>
  </div>`;
};
let exitArm=0;
function confirmExit(){if(Date.now()-exitArm<2500){P=null;clearInterval(TIMER);return true}exitArm=Date.now();toast('Нажми ещё раз, чтобы выйти. Прогресс подхода не сохранится');return false}
function fmtT(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function curW(){return getW(stack[stack.length-1].p)}
function roundDone(){const W=curW();if(P.round<W.rmax){P.round++;P.rest=W.rest;P.between=false;render()}else nextSet()}
function nextSet(){const W=curW();if(P.set<W.sets.length-1){P.set++;P.round=1;P.rest=Math.max(W.rest,120);P.between=true;render()}else finish()}
function tick(){clearInterval(TIMER);if(!P||P.rest<=0)return;TIMER=setInterval(()=>{P.rest--;const e=document.getElementById('tm');if(P.rest<=0){clearInterval(TIMER);try{TG&&TG.HapticFeedback.notificationOccurred('success')}catch(e){};render();return}if(e)e.textContent=fmtT(P.rest)},1000)}
function markDone(key){const before=total();S.done[key]=todayISO();S.log.push(todayISO());save();return D.ladder.find(st=>stepPaid(st)&&st.n>before&&st.n<=total())}
function finish(){
  const W=curW();const opened=markDone(W.key);P=null;clearInterval(TIMER);
  stack.pop();go('finish',{opened:opened?opened.t:null});
}

function calcRes(){
  const b=10*C.w+6.25*C.h-5*C.age+(C.sex==='m'?5:-161);
  let k=b*parseFloat(C.act);k*= C.goal==='cut'?0.8:C.goal==='mass'?1.2:1;
  const sp=C.goal==='cut'?[.35,.25,.40]:C.goal==='mass'?[.30,.20,.50]:[.30,.30,.40];
  let p=k*sp[0]/4,f=k*sp[1]/9;p=Math.max(p,1.6*C.w);f=Math.max(f,0.8*C.w);const c=Math.max(0,(k-p*4-f*9)/4);
  return {kcal:Math.round(k),p:Math.round(p),f:Math.round(f),c:Math.round(c)};
}
