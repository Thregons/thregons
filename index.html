  const wk=P9.weeks[w],L=wk.lec&&P9.lect[wk.lec];
  return `<div class="scr full">${topbar('Неделя '+wk.w)}
  <div><div class="cap">${esc(P9.stages[wk.m-1].name)}${wk.light?' · облегчённая':''}</div><div class="h1" style="margin-top:8px">${esc(wk.t)}</div><div class="muted" style="margin-top:8px;line-height:1.5">${esc(wk.idea)}</div></div>
  ${L?`<button class="card" style="border-color:var(--vi2);text-align:left;width:100%" onclick="go('p90lec',{k:'lect',id:'${wk.lec}'})"><div class="row sb"><div class="cap" style="color:var(--vi2)">Лекция недели · ${esc(L.area)}</div>${S.read['p9'+wk.lec]?`<span class="done">${I.check}</span>`:I.chev}</div><div class="h2">${esc(L.title)}</div><div class="sm muted" style="line-height:1.5">${esc(L.about)}</div></button>`:''}
  <div class="list">${wk.days.map((dy,d)=>{const dn=S.done[pkey(w,d)];
    return `<button class="item" onclick="go('${isWork(dy)?'p90day':'p90rest'}',{w:${w},d:${d}})"><span class="${dn?'done':isWork(dy)?'':'muted'}">${dn?I.check:dayIcon(dy)}</span><div class="grow"><div class="xs muted" style="font-weight:800">${esc(DAYN[dy.dn].toUpperCase())}</div><div class="t">${esc(dayLabel(dy))}</div>${dy.extra?`<div class="xs muted">${esc(dy.extra)}</div>`:''}</div>${I.chev}</button>`}).join('')}</div></div>`;
};

const lecGet=(k,id)=>k==='lect'?P9.lect[id]:(k==='g'?P9.guides:P9.xl).find(x=>x.id===id);
SCR.p90lib=()=>{
  const row=(k,l,cap)=>`<button class="item" onclick="go('p90lec',{k:'${k}',id:'${l.id}'})"><div class="grow"><div class="xs" style="color:var(--tq);font-weight:800">${esc(cap.toUpperCase())}</div><div class="t">${esc(l.title)}</div></div>${S.read['p9'+l.id]?`<span class="done">${I.check}</span>`:I.chev}</button>`;
  return `<div class="scr full">${topbar('Лекции и гайды')}
  <div class="h2">Гайды</div><div class="list">${P9.guides.map(g=>row('g',g,'гайд')).join('')}</div>
  <div class="h2">Бонус-лекции</div><div class="list">${P9.xl.map(l=>row('x',l,l.area)).join('')}</div>
  <div class="h2">Лекции по неделям</div><div class="list">${Object.values(P9.lect).map(l=>row('lect',l,'неделя '+l.week+' · '+l.area)).join('')}</div></div>`;
};
SCR.p90lec=({k,id})=>{
  const L=lecGet(k,id);S.read['p9'+id]=1;save();
  const src=(L.sources&&L.sources.length?L.sources:k==='g'?P9.gsrc:[]);
  return `<div class="scr full">${topbar(k==='g'?'Гайд':'Лекция')}
  <div><div class="cap" style="color:var(--vi2)">${esc(L.area)}${L.week&&k==='lect'?' · неделя '+L.week:''}${L.dur?' · '+esc(L.dur):''}</div><div class="h1" style="margin-top:8px">${esc(L.title)}</div><div class="muted" style="margin-top:8px;line-height:1.5">${esc(L.about)}</div></div>
  ${L.disc?`<div class="card sm muted" style="line-height:1.5">${esc(L.disc)}</div>`:''}
  ${L.sections.map(s=>`<div class="card"><div class="h2">${esc(s.h)}</div>${s.items.map(x=>`<div style="line-height:1.55">${esc(x)}</div>`).join('')}</div>`).join('')}
  ${L.practice?`<div class="card" style="border-color:var(--tq)"><div class="cap">Практика</div><div style="line-height:1.55">${esc(L.practice)}</div></div>`:''}
  ${L.quiz&&L.quiz.length?`<div class="card"><div class="cap">Проверь себя</div>${L.quiz.map(q=>`<details><summary style="font-weight:700;cursor:pointer;padding:6px 0;line-height:1.4">${esc(q.q)}</summary>${q.options.map((o,i)=>`<div class="sm" style="padding:3px 0;${i===q.answer?'color:var(--tq);font-weight:700':'color:var(--mu)'}">${i===q.answer?'✓ ':'· '}${esc(o)}</div>`).join('')}</details>`).join('')}</div>`:''}
  ${src.length?`<details class="card"><summary style="font-weight:700;cursor:pointer">Источники</summary><div class="sm" style="line-height:1.6;display:flex;flex-direction:column;gap:6px;margin-top:6px">${src.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join('')}</div></details>`:''}
  <button class="btn ghost" onclick="back()">Понятно</button></div>`;
};
function setP9Lv(k){S.lvl=k;if(k!=='gym')S.max=false;save();render()}
SCR.p90day=({w,d})=>{
  const wk=P9.weeks[w],dy=wk.days[d],dn=S.done[pkey(w,d)];
  const head=`${topbar('Неделя '+wk.w+' · '+DAYN[dy.dn])}<div><div class="h1">${esc(dayLabel(dy))}</div>${dn?`<div class="sm done" style="margin-top:6px;font-weight:700">Сделано ${fmtD(dn)}</div>`:''}</div>${levelSeg(S.lvl,'setP9Lv')}`;
  if(dy.ty==='test'){
    const t=dy.test||{t:'Тестирование',rule:P9.tests.note,items:P9.tests.items.map(x=>x.name),lv:{}};
    const cx=(t.lv&&t.lv[S.lvl])||[];
    const k='t|'+pkey(w,d);
    return `<div class="scr full">${head}
    <div class="card"><div class="cap">Правило</div><div style="line-height:1.5">${esc(t.rule)}</div></div>
    ${t.items&&t.items.length?`<div class="card"><div class="cap">Упражнения теста</div>${t.items.map((x,i)=>`<div class="ex"><span class="num">${i+1}</span><div style="flex:1">${esc(x)}</div></div>`).join('')}</div>`:''}
    ${cx.length?cx.map(c=>`<div class="card"><div class="cap">Комплекс «${esc(c.name)}»</div>${c.items.map(x=>`<div class="ex"><div style="flex:1">${esc(x)}</div></div>`).join('')}</div>`).join(''):''}
    ${t.note?`<div class="sm muted">${esc(t.note)}</div>`:''}
    <label class="l">Мой результат<input class="f" value="${esc(S.tests[k]||'')}" placeholder="Например: 32 отжимания, 41 приседание, планка 1:20…" onchange="S.tests['${k}']=this.value;save()"></label>
    ${dn?'':`<button class="btn" onclick="p90TestDone(${w},${d})">${I.check}Тест пройден</button>`}
    ${w===11&&S.tests['t|'+pkey(0,5)]?`<div class="card"><div class="cap">Старт · неделя 1</div><div>${esc(S.tests['t|'+pkey(0,5)])}</div></div>`:''}
    </div>`;
  }
  const lk=curLv(),L=dy.lv[lk];
  return `<div class="scr full">${head}
  ${S.lvl==='gym'?`<button class="btn ghost sm" onclick="S.max=!S.max;save();render()">${S.max?'Вернуться к «Зал»':'Версия «Макс»: все 3 блока'}</button>`:''}
  <div class="card"><div class="row sb sm"><span class="muted">Время</span><span>${esc(L.time)}</span></div><div class="row sb sm"><span class="muted">Круги</span><span>${esc(/1 круг/.test(dy.fmt)?'1 на сет':L.rounds)}</span></div><div class="row sb sm" style="align-items:flex-start"><span class="muted">Отдых</span><span style="text-align:right;max-width:70%">${esc(L.rest)}</span></div>
  ${L.take?`<div class="sm" style="color:var(--vi2)">${esc(L.take)}</div>`:''}</div>
  ${dy.warm?`<div class="card"><div class="cap">Разминка</div><div class="sm">${esc(dy.warm)}</div></div>`:''}
  ${dy.fmt||dy.notes.length?`<div class="card"><div class="cap">Как выполнять</div>${dy.fmt?`<div class="sm">${esc(dy.fmt)}</div>`:''}${dy.notes.map(n=>`<div class="sm muted">${esc(n)}</div>`).join('')}</div>`:''}
  ${L.sets.map((x,k)=>`<div class="card"><div class="cap">${x.b?esc(x.b.replace(': турник и брусья',''))+' · ':''}Сет ${k+1}</div>${x.ex.map(e=>`<button class="ex" style="background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:#fff" onclick="go('exercise',{n:${esc(JSON.stringify(e[0]))},v:${e[2]}})"><div style="flex:1">${esc(e[0])}</div><div class="reps">${esc(e[1])}</div></button>`).join('')}</div>`).join('')}
  <div class="sm muted">${esc(P9.model.cooldown)}</div>
  <button class="btn" onclick="go('player',{kind:'p90',w:${w},d:${d},lv:'${lk}'})">${I.play}Начать тренировку</button>
  <button class="btn ghost sm" onclick="p90Min(${w},${d})">Сделал минимум: 1 сет и 2 круга</button></div>`;
};
function p90TestDone(w,d){const op=markDone(pkey(w,d));stack.pop();go('finish',{opened:op?op.t:null})}
function p90Min(w,d){const op=markDone(pkey(w,d));toast('День засчитан. Минимум лучше пропуска');stack.pop();go('finish',{opened:op?op.t:null})}

SCR.p90rest=({w,d})=>{
  const wk=P9.weeks[w],dy=wk.days[d];let body='';
  const lp=LVP[S.lvl];
  if(dy.ref.startsWith('cardio.')){const c=P9.cardio[dy.ref.split('.')[1]];
    body=`<div class="card"><div class="cap">Выбери одно · уровень «${LVN[S.lvl]}»</div>${c.opt[lp].map(o=>`<div class="sm" style="line-height:1.5">· ${esc(o)}</div>`).join('')}</div><div class="card"><div class="cap">Правило</div><div style="line-height:1.5">${esc(c.rule)}</div>${P9.cardio.rules.map(r=>`<div class="sm muted" style="line-height:1.5">${esc(r)}</div>`).join('')}</div>`;}
  else if(dy.ref==='recovery.session'){const r=P9.rec.session;
    body=`<div class="list">${r.steps.map((x,i)=>`<div class="item"><span class="num">${i+1}</span><div class="grow"><div class="t">${esc(x.name)}</div><div class="sm muted">${esc(x.time)}</div></div></div>`).join('')}</div>`;}
  else if(dy.ref==='recovery.rest_day'){body=`<div class="card"><div style="line-height:1.5">${esc(P9.rec.rest_day.text)}</div></div>`;}
  return `<div class="scr full">${topbar('Неделя '+wk.w+' · '+DAYN[dy.dn])}<div class="h1">${esc(dayLabel(dy))}</div>${body}
  ${dy.extra?`<div class="sm muted">${esc(dy.extra)}</div>`:''}
  <div class="card"><div class="cap">Утро</div><div class="sm">${esc(P9.morning)}</div></div></div>`;
};

SCR.p90info=()=>{
  const lvMap=[['start','super_light','Старт'],['home','base','Дом'],['street','base','Улица'],['gym','pro','Зал']];
  const homeNote={home:'весь блок «Свой вес» (нет турника и брусьев)',street:'по 2 сета из «Своего веса» и «Воркаута»',start:'облегчённый «Свой вес», 2 круга',gym:'сеты 1–2 из каждого блока, включая «Зал»'};
  const sec=(t,h)=>`<details class="card"><summary style="font-weight:800;cursor:pointer">${t}</summary><div class="sm" style="line-height:1.55;display:flex;flex-direction:column;gap:6px;margin-top:6px">${h}</div></details>`;
  const ul=a=>a.map(x=>`<div>· ${esc(x)}</div>`).join('');
  return `<div class="scr full">${topbar('Как устроена программа')}
  <div class="card"><div class="cap">Главное</div>${ul(P9.phil)}</div>
  ${sec('Правила',ul(P9.rules)+`<div class="muted">${esc(P9.model.pain_rule)}</div>`)}
  ${sec('Уровни',lvMap.map(([k,pk,n])=>{const v=P9.levels[pk];return `<div><b>${n}</b> — ${esc(homeNote[k])}. ${esc(v.time)}, ${esc(v.where)}. <span class="muted">${esc(v.for)}.</span></div>`}).join('')+`<div><b>Макс</b> — ${esc(P9.levels.max.note)} <span class="muted">${esc(P9.levels.max.for)}.</span></div><div class="muted">${esc(P9.levels.how_to_switch)}</div>`)}
  ${sec('Три блока тренировки',ul(P9.model.blocks)+`<div class="muted">${esc(P9.model.set)}</div>`)}
  ${sec('Разминка и зарядка',`<div>${esc(P9.warmup)}</div><div>${esc(P9.morning)}</div>`)}
  ${sec('Восстановление и сон',Object.entries(P9.rec.week_balance).map(([k,v])=>`<div><b>${esc(k[0].toUpperCase()+k.slice(1))}:</b> ${esc(v)}</div>`).join('')+'<div class="cap" style="margin-top:6px">Сон</div>'+ul(P9.rec.sleep)+'<div class="cap" style="margin-top:6px">После тренировки</div>'+ul(P9.rec.after_workout))}
  ${sec('Нервная система, психология, иммунитет','<div class="cap">Нервная система</div>'+ul(P9.nsp.nervous_system)+'<div class="cap">Психология</div>'+ul(P9.nsp.psychology)+'<div class="cap">Иммунитет</div>'+ul(P9.nsp.immunity))}
  ${sec('Тесты',`<div>${esc(P9.tests.note)}</div>`+ul(P9.tests.items.map(x=>x.name)))}
  ${sec('Чекап: анализы до и после',`<div class="muted">${esc(P9.checkup.disclaimer)}</div><div><b>Когда:</b> ${esc(P9.checkup.when.join('; '))}</div>`+ul(P9.checkup.tests)+P9.checkup.how_to_adjust.map(x=>`<div><b>Если ${esc(x.if)}</b> — ${esc(x.then)}</div>`).join(''))}
  ${sec('Кардио',`<div>${esc(P9.cardio.how)}</div>`+ul(P9.cardio.rules))}
  ${sec('12 лекций',Object.values(P9.lect).map(l=>`<div><b>Неделя ${l.week}. ${esc(l.title)}</b><br><span class="muted">${esc(l.about)}</span></div>`).join(''))}
  </div>`;
};

function todayP90(it,ia,dots,week,dateStr,ns){
  const nx=p90Next();let card='';
  if(nx){const wk=P9.weeks[nx.w],dy=wk.days[nx.d];const lk=curLv();
    card=`<div class="today"><div class="row sb"><div class="cap" style="color:#fff">Путь 90 дней · неделя ${wk.w}</div><div class="chip">${S.max&&S.lvl==='gym'?'Макс':LVN[S.lvl]}</div></div>
    <div class="h1">${esc(dayLabel(dy))}</div>
    <div class="sm" style="color:#EDE6FF">${esc(DAYN[dy.dn])} · ${esc(wk.t)}${dy.ty==='strength'?' · '+dy.lv[lk].sets.length+' сетов · '+esc(dy.lv[lk].time):''}</div>
    ${dy.ty==='strength'?`<button class="btn" onclick="go('player',{kind:'p90',w:${nx.w},d:${nx.d},lv:'${lk}'})">${I.play}Начать тренировку</button>`:''}
    <button class="btn ghost sm" style="background:var(--vid);border:0" onclick="go('p90day',{w:${nx.w},d:${nx.d}})">${dy.ty==='test'?'Открыть тест':'Посмотреть упражнения'}</button></div>`;}
  else card=`<div class="card"><div class="h2">Все 12 недель пройдены</div><div class="sm muted">Сравни финальный тест со стартом и сдай повторный чекап.</div></div>`;
  return `<div class="scr">
  <div class="row sb"><div><div class="h1" style="font-size:20px;letter-spacing:1.5px">THREGONS</div><div class="sm muted" style="margin-top:4px">${esc(dateStr[0].toUpperCase()+dateStr.slice(1))}</div></div><button class="back" onclick="setTab('me')" aria-label="Профиль">${I.user}</button></div>
  <div class="card"><div class="cap">Намерение дня</div><div style="font-size:17px;line-height:1.45;font-weight:700">${esc(it)}</div><div class="sm muted">${esc(ia)}</div><div style="height:1px;background:var(--ln)"></div>
  <div class="row sb"><div style="font-weight:700">Ритм недели: <span class="done">${week}</span></div><div class="sm muted">всего ${total()}</div></div><div class="dots" style="justify-content:space-between">${dots}</div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div class="sm muted" style="font-weight:700">Мой уровень</div>${levelSeg(S.lvl,'setP9Lv')}</div>
  ${card}
  <div class="grid2"><button class="tile" onclick="sub.train='p90';setTab('train')">${I.up}<div class="h2" style="font-size:16px">Путь 90 дней</div><div class="sm muted">${p90Stats().dn} из ${p90Stats().all} сделано</div></button>
  <button class="tile" onclick="sub.train='mar';setTab('train')">${I.cal}<div class="h2" style="font-size:16px">Марафоны</div><div class="sm muted">12 месяцев</div></button></div>
  ${ns?`<button class="item" onclick="setTab('know')"><span class="lock">${I.lock}</span><div class="grow"><div class="t">Следующий шаг знаний: ${esc(ns.t)}</div><div class="sm muted">Откроется через ${ns.n-total()} ${plural(ns.n-total(),'тренировку','тренировки','тренировок')}</div></div>${I.chev}</button>`:''}
  </div>`;
}

/* Telegram Mini App */
(function(){
  var T=window.Telegram&&window.Telegram.WebApp; if(!T||!T.initData&&!T.platform) return;
  try{T.ready();T.expand();}catch(e){}
  try{T.setHeaderColor('#120E24');T.setBackgroundColor('#120E24');}catch(e){}
  try{if(T.disableVerticalSwipes)T.disableVerticalSwipes();}catch(e){}
  var _r=render;
  render=function(x){_r(x);try{if(stack.length)T.BackButton.show();else T.BackButton.hide();}catch(e){}};
  try{T.BackButton.onClick(function(){if(stack.length)back();});}catch(e){}
})();
render();
</script>
